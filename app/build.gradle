plugins {
    id 'com.android.application'
}

def productionStoreFile = System.getenv('CHOBYAR_RELEASE_KEYSTORE')
def productionStorePassword = System.getenv('CHOBYAR_RELEASE_STORE_PASSWORD')
def productionKeyAlias = System.getenv('CHOBYAR_RELEASE_KEY_ALIAS')
def productionKeyPassword = System.getenv('CHOBYAR_RELEASE_KEY_PASSWORD')
def productionSigningReady = productionStoreFile && productionStorePassword && productionKeyAlias && productionKeyPassword

android {
    namespace 'ir.chobyar.sketch'
    compileSdk 35
    ndkVersion '27.0.12077973'

    def ciVersionCode = System.getenv('CHOBYAR_VERSION_CODE') ?: '1'
    def ciVersionName = System.getenv('CHOBYAR_VERSION_NAME') ?: '0.0.1'

    defaultConfig {
        applicationId 'ir.chobyar.sketch'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode.toInteger()
        versionName ciVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        // Reproducible public CI/development key. This identity is only for
        // debug and release-candidate builds; it must never sign production.
        chobyarDev {
            storeFile file('../chobyar-dev.jks')
            storePassword 'ChobYarDev123'
            keyAlias 'chobyar'
            keyPassword 'ChobYarDev123'
        }
        if (productionSigningReady) {
            chobyarRelease {
                storeFile file(productionStoreFile)
                storePassword productionStorePassword
                keyAlias productionKeyAlias
                keyPassword productionKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.chobyarDev
        }

        release {
            if (productionSigningReady) {
                signingConfig signingConfigs.chobyarRelease
            }
            debuggable false
            jniDebuggable false
            minifyEnabled false
        }

        releaseCandidate {
            initWith release
            signingConfig signingConfigs.chobyarDev
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            minifyEnabled false
        }
    }
}

// A production build must never silently fall back to the public development
// key. Keep RC builds installable, but fail any task that actually packages or
// assembles the production release when production credentials are absent.
tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'signReleaseBundle', 'installRelease']) {
        task.doFirst {
            if (!productionSigningReady) {
                throw new GradleException('Production signing configuration is missing. Use assembleReleaseCandidate for an internal RC build or provide CHOBYAR_RELEASE_* credentials for production.')
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.filament:filament-android:1.74.0'
    implementation 'com.google.android.filament:filamat-android:1.74.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
