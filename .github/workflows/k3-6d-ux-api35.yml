name: K3.6d UX API35 Regression

on:
  workflow_dispatch:
  push:
    branches:
      - k3-6d-coincident-point-authority

concurrency:
  group: k3-6d-ux-api35-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3-6d-ux-api35:
    name: K3.6d touch/stylus semantic regression on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Compile production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Initialize API35 evidence
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-artifacts"
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "evidence_initialized_before_emulator=true"
          } > "${GITHUB_WORKSPACE}/test-artifacts/runner-context.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run K3.6d API35 touch/stylus regression suite
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -uo pipefail
            ARTIFACT_DIR="${GITHUB_WORKSPACE}/test-artifacts"
            mkdir -p "$ARTIFACT_DIR"
            {
              echo "emulator_script_started=true"
              adb version
              adb devices -l
            } | tee "${ARTIFACT_DIR}/emulator-entry.txt"

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            failures=0
            run_class() {
              local cls="$1"
              local short="${cls##*.}"
              local out="${ARTIFACT_DIR}/${short}.txt"

              # Every interaction contract gets a clean persisted/session surface.
              # This prevents a preceding lifecycle or relationship test from becoming
              # anonymous state authority for the next semantic snap test.
              adb shell pm clear ir.chobyar.sketch >/dev/null || true
              adb shell pm clear ir.chobyar.sketch.test >/dev/null || true

              echo "=== ${cls} ===" | tee "$out"
              set +e
              adb shell am instrument -w -r -e class "$cls" \
                ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner \
                2>&1 | tee -a "$out"
              local instrument_status=${PIPESTATUS[0]}
              set -e

              if [[ $instrument_status -ne 0 ]] || ! grep -Eq '^OK \([0-9]+ tests?\)$' "$out"; then
                echo "K3.6d FAILURE: ${cls} (instrument_status=${instrument_status})" | tee -a "$out"
                failures=$((failures + 1))
              else
                echo "K3.6d PASS: ${cls}" | tee -a "$out"
              fi
            }

            set -e
            run_class ir.chobyar.sketch.K36dAutoConnectionPolicyInstrumentationTest
            run_class ir.chobyar.sketch.K36dMidpointAuthorityInstrumentationTest
            run_class ir.chobyar.sketch.K36dModelConstraintBadgeProjectionInstrumentationTest
            run_class ir.chobyar.sketch.K36dSnapFeedbackPriorityInstrumentationTest
            run_class ir.chobyar.sketch.K36dSnapPriorityAndExtensionFeedbackInstrumentationTest
            run_class ir.chobyar.sketch.K36dTouchStylusSelectionStabilityInstrumentationTest
            run_class ir.chobyar.sketch.K36dProductionEndpointConstraintAuthorityInstrumentationTest
            run_class ir.chobyar.sketch.K36dActivityLifecyclePersistenceInstrumentationTest

            if [[ $failures -ne 0 ]]; then
              echo "K3.6d API35 regression failures: $failures"
              exit 1
            fi

      - name: Upload K3.6d API35 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K3-6d-UX-API35-evidence
          path: ${{ github.workspace }}/test-artifacts/**
          if-no-files-found: error
          retention-days: 7
