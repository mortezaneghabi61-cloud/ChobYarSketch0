name: Publish Final APK Into Repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-final-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated RC42 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf downloaded
          gh run download 32618413652 \
            --repo "$GITHUB_REPOSITORY" \
            --name "ChobYar3D-release-candidate-performance" \
            --dir downloaded
          APK="$(find downloaded -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p releases
          cp "$APK" releases/ChobYar3D-Final-2026-08-23.apk
          sha256sum releases/ChobYar3D-Final-2026-08-23.apk | tee releases/ChobYar3D-Final-2026-08-23.apk.sha256
          BYTES="$(stat -c%s releases/ChobYar3D-Final-2026-08-23.apk)"
          test "$BYTES" -lt 104857600
          echo "apk_bytes=$BYTES"

      - name: Commit APK to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/ChobYar3D-Final-2026-08-23.apk releases/ChobYar3D-Final-2026-08-23.apk.sha256
          if git diff --cached --quiet; then
            echo "Final APK is already present."
            exit 0
          fi
          git commit -m "Add signed ChobYar3D final APK"
          git push origin HEAD:main
