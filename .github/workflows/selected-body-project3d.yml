name: Selected Body Project 3D Contract

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820
    paths:
      - '.github/scripts/apply-selected-body-project3d.py'
      - '.github/workflows/selected-body-project3d.yml'
      - 'app/src/main/java/ir/chobyar/sketch/OcctModelCadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/Project3DSelectedBodyInstrumentationTest.java'

permissions:
  contents: write

concurrency:
  group: selected-body-project3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CHOBYAR_VERSION_CODE: 40${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.project3d.selected.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sketch-core-type-safe-20260820
          fetch-depth: 0

      - name: Apply selected-body Project 3D contract
        id: patch
        continue-on-error: true
        run: python3 .github/scripts/apply-selected-body-project3d.py

      - uses: actions/setup-java@v5
        if: steps.patch.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: steps.patch.outcome == 'success'

      - name: Install Android 35 toolchain
        if: steps.patch.outcome == 'success'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.patch.outcome == 'success'
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        if: steps.patch.outcome == 'success'
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build production and instrumentation APKs
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run selected-body and mapper contracts on API 35
        id: contracts
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.Project3DSelectedBodyInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/project3d-selected.txt
            grep -q 'OK (3 tests)' test-artifacts/project3d-selected.txt
            adb logcat -d -v brief | grep 'Manual26100Project3D.*PROJECT3D_.*_RESULT' | sed -E 's/^.*(PROJECT3D_[A-Z_]+_RESULT)/\1/' | tee test-artifacts/project3d-selected-results.txt
            grep -q '^PROJECT3D_SELECTED_RESULT requested=22 lines=1 fallback=false$' test-artifacts/project3d-selected-results.txt
            grep -q '^PROJECT3D_ALL_RESULT requested=2 lines=2 fallback=true$' test-artifacts/project3d-selected-results.txt
            grep -q '^PROJECT3D_NO_EXACT_RESULT requested=0 guarded=true$' test-artifacts/project3d-selected-results.txt
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.Project3DExactInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/project3d-regression.txt
            grep -q 'OK (3 tests)' test-artifacts/project3d-regression.txt

      - name: Persist verified selected-body source or diagnostics
        if: always()
        shell: bash
        run: |
          set -eu
          VERIFIED=false
          if [ '${{ steps.patch.outcome }}' = 'success' ] && [ '${{ steps.build.outcome }}' = 'success' ] && [ '${{ steps.contracts.outcome }}' = 'success' ]; then
            VERIFIED=true
          else
            git restore -- app/src/main/java/ir/chobyar/sketch/OcctModelCadCanvasView.java app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java || true
            rm -f app/src/androidTest/java/ir/chobyar/sketch/Project3DSelectedBodyInstrumentationTest.java
          fi
          mkdir -p docs
          cat > docs/project3d-selected-body-status.txt <<EOF
          source_sha=${{ github.sha }}
          workflow_run=${{ github.run_id }}
          patch=${{ steps.patch.outcome }}
          build=${{ steps.build.outcome }}
          contracts=${{ steps.contracts.outcome }}
          verified=$VERIFIED
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$VERIFIED" = true ]; then
            git add app/src/main/java/ir/chobyar/sketch/OcctModelCadCanvasView.java app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java app/src/androidTest/java/ir/chobyar/sketch/Project3DSelectedBodyInstrumentationTest.java docs/project3d-selected-body-status.txt
            git commit -m 'Route Project 3D through selected exact Body [skip ci]' || true
          else
            git add docs/project3d-selected-body-status.txt
            git commit -m 'Record selected-body Project 3D status [skip ci]' || true
          fi
          git fetch origin refactor/sketch-core-type-safe-20260820
          git rebase origin/refactor/sketch-core-type-safe-20260820
          git push origin HEAD:refactor/sketch-core-type-safe-20260820

      - name: Upload selected-body Project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-project3d-selected-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce selected-body Project contract
        if: always()
        run: |
          test '${{ steps.patch.outcome }}' = 'success'
          test '${{ steps.build.outcome }}' = 'success'
          test '${{ steps.contracts.outcome }}' = 'success'
