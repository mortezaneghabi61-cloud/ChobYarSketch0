name: K3.7 Apply Topology Confidence

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - k3-7-occt-topology
    paths:
      - '.github/scripts/apply_k37_topology_confidence.py'
      - '.github/workflows/k37-topology-confidence-apply.yml'

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: k3-7-occt-topology
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Apply fail-closed History rematch policy
        run: python3 .github/scripts/apply_k37_topology_confidence.py

      - name: Run topology confidence unit contract
        run: gradle :app:testDebugUnitTest --tests ir.chobyar.sketch.OcctTopologyConfidencePolicyTest --stacktrace

      - name: Commit production fix
        run: |
          git config user.name "chobyar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/ir/chobyar/sketch/OcctStableCadCanvasView.java
          if ! git diff --cached --quiet; then
            git commit -m "K3.7: fail closed on ambiguous topology rematch [skip ci]"
            git push origin HEAD:k3-7-occt-topology
          fi
