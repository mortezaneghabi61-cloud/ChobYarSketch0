name: ChobYar CAD Agent

on:
  pull_request:
    paths:
      - "agent_runtime/**"
      - ".github/workflows/chobyar-agent.yml"
      - ".gitignore"
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      task:
        description: "CAD/Android engineering task for the ChobYar professor agent"
        required: true
        type: string
      apply_changes:
        description: "Allow guarded code/test/doc edits and open a PR when files change"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_runtime/pyproject.toml

      - name: Install runtime test dependencies
        run: python -m pip install -e agent_runtime pytest

      - name: Guardrail tests
        run: pytest -q agent_runtime/tests

  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'mortezaneghabi61-cloud' &&
       startsWith(github.event.issue.title, '[agent]'))
    needs: runtime-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHOBYAR_AGENT_MODEL: gpt-5.6
      DISPATCH_TASK: ${{ inputs.task }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_runtime/pyproject.toml

      - name: Install agent runtime
        run: python -m pip install -e agent_runtime pytest

      - name: Build supervised task
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s' "$DISPATCH_TASK" > .agent-task.txt
          else
            jq -r '.issue.title + "\n\n" + (.issue.body // "")' "$GITHUB_EVENT_PATH" > .agent-task.txt
          fi

      - name: Run professor engineering agent
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.apply_changes }}" == "true" ]]; then
            args+=(--apply)
          fi
          chobyar-agent --task "$(cat .agent-task.txt)" "${args[@]}"

      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chobyar-agent-report-${{ github.run_id }}
          path: .agent-state/latest_report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Open candidate pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Agent produced no repository changes."
            exit 0
          fi
          branch="agent/auto-${GITHUB_RUN_ID}"
          git config user.name "chobyar-agent"
          git config user.email "chobyar-agent@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Agent candidate: CAD engineering task"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "ChobYar agent candidate #${GITHUB_RUN_ID}" \
            --body-file .agent-state/latest_report.md
