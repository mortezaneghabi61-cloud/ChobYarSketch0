name: CAD Kernel V2 Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/scripts/build_occt_android.sh'
      - '.github/workflows/cad-kernel-v2-gate.yml'
      - 'docs/CAD_KERNEL_REWRITE_V2.md'

permissions:
  contents: read

concurrency:
  group: cad-kernel-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernel-gate:
    runs-on: ubuntu-latest
    env:
      CHOBYAR_VERSION_CODE: 26082901
      CHOBYAR_VERSION_NAME: 0.5.kernel-v2
      CHOBYAR_OCCT_ROOT: ${{ github.workspace }}/.occt/install-arm64

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android and native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache OCCT 8 Android arm64
        uses: actions/cache@v4
        with:
          path: .occt/install-arm64
          key: occt-v8.0.0-d3056ef80c9668f395da40f5fd7be186cae4501f-android26-arm64-ndk27-step-stl1

      - name: Build exact OCCT backend
        run: bash .github/scripts/build_occt_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Run V2 contract tests and compile production candidate
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleReleaseCandidate --stacktrace

      - name: Verify exact arm64 native library and APK signatures
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RC_APK=app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk
          test -s "$DEBUG_APK"
          test -s "$RC_APK"
          unzip -l "$RC_APK" | grep -q 'lib/arm64-v8a/libchobyar_brep.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RC_APK"
