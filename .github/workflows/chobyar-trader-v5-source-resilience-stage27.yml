name: ChobYar Trader v5 Source Resilience Stage 27

on:
  pull_request:
    branches:
      - automation/chobyar-trader-v55-paper-entry-gate
    paths:
      - 'ops/chobyar-trader/v5/execution_safety/live_adversarial_veto_stage26.py'
      - 'ops/chobyar-trader/v5/execution_safety/test_live_adversarial_veto_stage26.py'
      - 'ops/chobyar-trader/install-v5-source-resilience-stage27.sh'
      - 'ops/chobyar-trader/v5/execution_safety/STAGE27_SOURCE_RESILIENCE.md'
      - '.github/workflows/chobyar-trader-v5-source-resilience-stage27.yml'

permissions:
  contents: read

jobs:
  stage27-source-resilience:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Exact-head lock
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Compile and deterministic suites
        env:
          PYTHONPATH: ops/chobyar-trader/v5/execution_safety
        run: |
          set -euo pipefail
          d='ops/chobyar-trader/v5/execution_safety'
          python3 -m py_compile \
            "$d/adversarial_market_defense_stage24.py" \
            "$d/live_adversarial_veto_stage26.py" \
            "$d/live_entry_risk_stage25.py" \
            "$d/live_executor_stage22.py"
          python3 "$d/test_adversarial_market_defense_stage24.py" -q
          python3 "$d/test_live_adversarial_veto_stage26.py" -q
          python3 "$d/test_live_entry_risk_stage25.py" -q
          python3 "$d/test_live_executor_stage22.py" -q
          bash -n ops/chobyar-trader/install-v5-source-resilience-stage27.sh

      - name: Prove source classes are explicit and honest
        run: |
          set -euo pipefail
          f='ops/chobyar-trader/v5/execution_safety/live_adversarial_veto_stage26.py'
          grep -q 'MIN_REFERENCE_AGGREGATORS = 3' "$f"
          grep -q 'reference_aggregator' "$f"
          grep -q 'local_execution_venue' "$f"
          grep -q 'direct_exchange_optional' "$f"
          grep -q 'STAGE27_REFERENCE_RESILIENCE' "$f"
          grep -q 'coinlore' "$f"
          grep -q 'coinpaprika' "$f"
          grep -q 'coingecko' "$f"

      - name: Prove old state cannot authorize Stage27
        run: |
          set -euo pipefail
          f='ops/chobyar-trader/v5/execution_safety/live_adversarial_veto_stage26.py'
          grep -q 'STATE_VERSION = 2' "$f"
          grep -q 'stage27_version_mismatch' "$f"
          grep -q 'stage27_source_policy_mismatch' "$f"
          grep -q 'stage27_reference_quorum_mismatch' "$f"
          grep -q 'stage27_evidence_class_diversity_insufficient' "$f"

      - name: Prove Stage27 does not add exchange mutation
        run: |
          set -euo pipefail
          d='ops/chobyar-trader/v5/execution_safety'
          ! grep -nE '\.(post|delete|put|patch)\(' \
            "$d/adversarial_market_defense_stage24.py" \
            "$d/live_adversarial_veto_stage26.py"
          test "$(grep -Ec 'client\.post\(ORDER_PATH' "$d/live_executor_stage22.py")" = 1

      - name: Prove installer preserves paper and hard safety gates
        run: |
          set -euo pipefail
          i='ops/chobyar-trader/install-v5-source-resilience-stage27.sh'
          grep -q 'TRADING_MODE=paper' "$i"
          grep -q 'LIVE_TRADING_ENABLED=false' "$i"
          grep -q 'LIVE_MAX_ORDER_USDT=10' "$i"
          grep -q 'WITHDRAWALS_ENABLED=false' "$i"
          grep -q 'LEVERAGE_ENABLED=false' "$i"
          grep -q 'MARGIN_ENABLED=false' "$i"
          grep -q 'FUTURES_ENABLED=false' "$i"
          grep -q 'OTC_ENABLED=false' "$i"
          grep -q 'INITIAL_POLICY=FAIL_CLOSED_UNTIL_HISTORY_WARM' "$i"
          ! grep -Eq 'systemctl (restart|start|enable).*chobyar-trader\.service' "$i"
          ! grep -Eq 'sed .*\.env|tee .*\.env|cat > .*\.env|echo .*>> .*\.env' "$i"
