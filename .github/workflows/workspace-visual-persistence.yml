name: Workspace Visual Persistence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java'
      - 'app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectAdapter.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadAppearanceController.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java'
      - 'app/src/main/java/ir/chobyar/sketch/SectionViewController.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java'
      - 'app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/WorkspaceVisualProjectStateInstrumentationTest.java'
      - '.github/workflows/workspace-visual-persistence.yml'

permissions:
  contents: read

concurrency:
  group: workspace-visual-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-visual-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 40${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.visual-project.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate visual state remains outside exact model History
        run: |
          set -euo pipefail
          grep -q 'final class WorkspaceVisualProjectState' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java
          grep -q 'final class WorkspaceVisualProjectAdapter' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectAdapter.java
          grep -q 'material.put("preset", appearance.preset.key)' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java
          grep -q 'material.put("roughness", appearance.roughness)' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java
          grep -q 'material.put("metallic", appearance.metallic)' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java
          grep -q 'cut.put("offsetMm", section.offsetMm())' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java
          grep -q 'cut.put("flipped", section.isFlipped())' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java
          grep -q 'CadMaterialPreset.State restore' app/src/main/java/ir/chobyar/sketch/CadAppearanceController.java
          grep -q 'void restore(boolean nextEnabled' app/src/main/java/ir/chobyar/sketch/SectionViewController.java
          grep -q 'workspaceVisual' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java
          grep -q 'WorkspaceVisualProjectAdapter.exportState' app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java
          grep -q 'CadProjectPersistenceController.encode(cad,appearance,sectionView)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -q 'CadProjectPersistenceController.restore(cad,appearance,sectionView,gpuSurface::setAppearance,raw)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          ! grep -q 'NativeBRepKernel\|OcctTopologyRef\|FeatureGraph' app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectAdapter.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run visual workspace persistence contracts on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.WorkspaceVisualProjectStateInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/workspace-visual-persistence.txt
            grep -q 'OK (9 tests)' test-artifacts/workspace-visual-persistence.txt
      - name: Upload visual persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-workspace-visual-persistence-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
