name: Reference Image Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 41${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.reference.${{ github.run_number }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "REFERENCE_IMAGE_EXACT_HEAD expected=${expected} actual=${actual}"
          test "$actual" = "$expected"
      - name: Validate production reference-image wiring
        run: |
          set -euo pipefail
          grep -Fq 'REQUEST_REFERENCE_IMAGE=1702' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -Fq 'intent.setType("image/*")' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -Fq 'cad.setReferenceImage(bitmap,"Reference Image")' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -Fq 'cad.showReferenceImageSettings()' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -Fq '▧ Reference Image' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -Fq 'float widthMm=100f,centerU,centerV,rotationDeg,opacity=.55f;boolean visible=true;' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'activePlane==null?Geometry3D.xy():activePlane' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'PointF q=project(image.plane.point(u,v))' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'image.widthMm=Math.max(1f,parseLocal(width))' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'image.centerU=parseLocal(x)' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'image.centerV=parseLocal(y)' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'image.rotationDeg=parseLocal(angle)' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'image.opacity=Math.max(.05f,value/100f)' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          grep -Fq 'image.visible=!image.visible' app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run reference-image contracts on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.ReferenceImageContractInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/reference-image-instrumentation.txt
            grep -Fq 'OK (4 tests)' test-artifacts/reference-image-instrumentation.txt
            adb logcat -d -v brief | grep 'ReferenceImageContract.*_RESULT' | sed -E 's/^.*(REFERENCE_IMAGE_[A-Z_]+_RESULT)/\1/' | tee test-artifacts/reference-image-results.txt
            grep -Fq 'REFERENCE_IMAGE_ATTACH_RESULT plane=' test-artifacts/reference-image-results.txt
            grep -Fq 'REFERENCE_IMAGE_CALIBRATION_RESULT width=62.4 u=13.75 v=-8.25 rotation=17.5 opacity=0.37 visible=false' test-artifacts/reference-image-results.txt
            grep -Fq 'REFERENCE_IMAGE_CAMERA_RESULT registered=true views=ISO,RIGHT,TOP plane=' test-artifacts/reference-image-results.txt
            grep -Fq 'REFERENCE_IMAGE_ITEM_RESULT add=true remove=true remaining=false' test-artifacts/reference-image-results.txt
      - name: Upload reference-image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-reference-image-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
