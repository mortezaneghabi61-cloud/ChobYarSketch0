name: Apply Material UI Patch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/material-presets-20260821
    paths:
      - '.github/scripts/apply-material-ui.py'
      - '.github/workflows/apply-material-ui.yml'

permissions:
  contents: write

concurrency:
  group: apply-material-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-presets-20260821
          fetch-depth: 0
      - name: Patch production Material UI
        run: python3 .github/scripts/apply-material-ui.py
      - name: Commit patched Activity
        run: |
          if git diff --quiet -- app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java; then
            echo 'Material UI already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          git commit -m 'Wire material presets into production workspace UI'
          git pull --rebase origin feature/material-presets-20260821
          git push origin HEAD:feature/material-presets-20260821
