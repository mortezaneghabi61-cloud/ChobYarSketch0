name: K3.7 Sync Main

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - k3-7-occt-topology
    paths:
      - '.github/workflows/k37-sync-main.yml'

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout topology branch
        uses: actions/checkout@v4
        with:
          ref: k3-7-occt-topology
          fetch-depth: 0

      - name: Merge latest main and push
        run: |
          git config user.name "chobyar-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:k3-7-occt-topology
