name: Android Emulator Smoke Test

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Launch and sketch on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHOBYAR_VERSION_CODE: 10${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.1.smoke.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply collision-safe Sketch core API
        if: github.ref == 'refs/heads/refactor/sketch-core-type-safe-20260820'
        run: |
          python3 .github/scripts/refactor_sketch_core.py
          python3 .github/scripts/add_sketch_redo.py
          git config user.name "chobyar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/src/main/java/ir/chobyar/sketch/CadCanvasView.java app/src/main/java/ir/chobyar/sketch/SmartCadCanvasView.java app/src/main/java/ir/chobyar/sketch/ChobYarShaprCanvasView.java app/src/main/java/ir/chobyar/sketch/ShaprStyleCadCanvasView.java app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "Apply Sketch core refactor and redo contract [skip ci]"
            git push origin HEAD:refactor/sketch-core-type-safe-20260820
          fi

      - name: Validate Sketch core refactor
        if: github.ref == 'refs/heads/refactor/sketch-core-type-safe-20260820' || github.head_ref == 'refactor/sketch-core-type-safe-20260820'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/ir/chobyar/sketch')
          cad = (root/'CadCanvasView.java').read_text(encoding='utf-8')
          smart = (root/'SmartCadCanvasView.java').read_text(encoding='utf-8')
          chob = (root/'ChobYarShaprCanvasView.java').read_text(encoding='utf-8')
          shapr = (root/'ShaprStyleCadCanvasView.java').read_text(encoding='utf-8')
          activity = (root/'ChobYarActivity.java').read_text(encoding='utf-8')
          required = [
              'protected final List<Entity> entities',
              'protected Entity selected',
              'protected float viewScale',
              'protected float offsetX',
              'protected float offsetY',
              'protected final Entity coreFindHit',
              'protected final void coreSaveUndo',
              'protected final boolean coreIsVisible',
              'protected final float coreScreenToWorldX',
              'protected final float coreScreenToWorldY',
              'protected final void coreObserveScaleGesture',
              'redoStack = new ArrayDeque<>()',
              'public boolean canUndoSketch()',
              'public boolean canRedoSketch()',
              'public boolean redoSketch()',
          ]
          for token in required:
              if token not in cad:
                  raise SystemExit(f'Missing Sketch core contract: {token}')
          forbidden = [
              'protected Entity findHit(float x,float y)',
              'protected void saveUndo()',
              'protected boolean isVisible(Entity e)',
              'protected float screenToWorldX(float sx)',
              'protected float screenToWorldY(float sy)',
          ]
          for token in forbidden:
              if token in cad:
                  raise SystemExit(f'Legacy helper was incorrectly widened: {token}')
          for name, src in [('SmartCadCanvasView', smart), ('ChobYarShaprCanvasView', chob)]:
              for token in ('java.lang.reflect.Field', 'java.lang.reflect.Method', 'getDeclaredField', 'getDeclaredMethod'):
                  if token in src:
                      raise SystemExit(f'{name} still uses reflection token: {token}')
          if 'coreFindHit(wx, wy)' not in smart:
              raise SystemExit('Smart selection is not routed through coreFindHit')
          if 'smartSelectionSnapshot()' not in chob:
              raise SystemExit('ChobYarShaprCanvasView is not using Smart selection contract')
          if 'coreSaveUndo();' not in smart or 'coreSaveUndo();' not in chob:
              raise SystemExit('Undo is not routed through the Sketch core contract')
          if shapr.count('coreObserveScaleGesture(event);') < 2:
              raise SystemExit('Dimension label does not seed/maintain the production scale detector')
          for token in ('this::undoAction', 'this::redoAction', 'cad.redoSketch()', 'cad.redoLastFeature()'):
              if token not in activity:
                  raise SystemExit(f'2D/3D history routing is missing: {token}')
          print('Collision-safe Sketch core and isolated undo/redo source contract validated')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build emulator-compatible app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar3D-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ChobYar UI, pinch, stylus, history and touch navigation smoke tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            # The stock Pixel Launcher occasionally ANRs on a cold headless boot
            # and its system dialog obscures ChobYar from UIAutomator. The launcher
            # is irrelevant to this direct-activity smoke test, so disable it only
            # inside the disposable CI emulator before launching the app.
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            python3 .github/scripts/emulator_smoke.py
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.PinchZoomInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/pinch-instrumentation.txt
            grep -q 'OK (1 test)' test-artifacts/pinch-instrumentation.txt
            adb logcat -d -v brief | grep 'PinchZoomTest.*PINCH_ZOOM_RESULT' | tail -n 1 | sed -E 's/^.*PINCH_ZOOM_RESULT /PINCH_ZOOM_RESULT /' | tee test-artifacts/pinch-viewscale.txt
            test -s test-artifacts/pinch-viewscale.txt
            grep -Eq '^PINCH_ZOOM_RESULT before=[0-9.]+ after=[0-9.]+' test-artifacts/pinch-viewscale.txt
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.TouchInputContractInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/touch-input-contract.txt
            grep -q 'OK (3 tests)' test-artifacts/touch-input-contract.txt
            adb logcat -d -v brief | grep 'TouchInputContract.*_RESULT' | sed -E 's/^.*(STYLUS_RESULT|PAN_RESULT|DIMENSION_LABEL_PINCH_RESULT)/\1/' | tee test-artifacts/touch-viewscale.txt
            test $(grep -c '_RESULT' test-artifacts/touch-viewscale.txt) -eq 3
            grep -q '^STYLUS_RESULT viewScale=' test-artifacts/touch-viewscale.txt
            grep -q '^PAN_RESULT before=' test-artifacts/touch-viewscale.txt
            grep -q '^DIMENSION_LABEL_PINCH_RESULT before=' test-artifacts/touch-viewscale.txt
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SketchUndoRedoInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/sketch-undo-redo.txt
            grep -q 'OK (1 test)' test-artifacts/sketch-undo-redo.txt
            adb logcat -d -v brief | grep 'SketchUndoRedo.*UNDO_REDO_RESULT' | tail -n 1 | sed -E 's/^.*UNDO_REDO_RESULT /UNDO_REDO_RESULT /' | tee test-artifacts/sketch-undo-redo-result.txt
            grep -q '^UNDO_REDO_RESULT afterCreate=1 afterUndo=0 afterRedo=1 afterPan=1$' test-artifacts/sketch-undo-redo-result.txt

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-emulator-smoke-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Persist refactor smoke result
        if: always() && github.ref == 'refs/heads/refactor/sketch-core-type-safe-20260820'
        env:
          CHOBYAR_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p docs
          printf 'status=%s\nsource_sha=%s\nworkflow_run=%s\n' "$CHOBYAR_JOB_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > docs/sketch-core-smoke-status.txt
          git config user.name "chobyar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs/sketch-core-smoke-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Sketch core smoke result [skip ci]"
            git push origin HEAD:refactor/sketch-core-type-safe-20260820
          fi
