name: Android Emulator Smoke Test

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Launch and sketch on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHOBYAR_VERSION_CODE: 10${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.1.smoke.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply collision-safe Sketch core API
        if: github.ref == 'refs/heads/refactor/sketch-core-type-safe-20260820'
        run: |
          python3 .github/scripts/refactor_sketch_core.py
          git config user.name "chobyar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/src/main/java/ir/chobyar/sketch/CadCanvasView.java app/src/main/java/ir/chobyar/sketch/SmartCadCanvasView.java app/src/main/java/ir/chobyar/sketch/ChobYarShaprCanvasView.java
          if ! git diff --cached --quiet; then
            git commit -m "Use collision-safe Sketch core API [skip ci]"
            git push origin HEAD:refactor/sketch-core-type-safe-20260820
          fi

      - name: Validate Sketch core refactor
        if: github.ref == 'refs/heads/refactor/sketch-core-type-safe-20260820'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/ir/chobyar/sketch')
          cad = (root/'CadCanvasView.java').read_text(encoding='utf-8')
          smart = (root/'SmartCadCanvasView.java').read_text(encoding='utf-8')
          chob = (root/'ChobYarShaprCanvasView.java').read_text(encoding='utf-8')
          required = [
              'protected final List<Entity> entities',
              'protected Entity selected',
              'protected float viewScale',
              'protected float offsetX',
              'protected float offsetY',
              'protected final Entity coreFindHit',
              'protected final void coreSaveUndo',
              'protected final boolean coreIsVisible',
              'protected final float coreScreenToWorldX',
              'protected final float coreScreenToWorldY',
          ]
          for token in required:
              if token not in cad:
                  raise SystemExit(f'Missing Sketch core contract: {token}')
          forbidden = [
              'protected Entity findHit(float x,float y)',
              'protected void saveUndo()',
              'protected boolean isVisible(Entity e)',
              'protected float screenToWorldX(float sx)',
              'protected float screenToWorldY(float sy)',
          ]
          for token in forbidden:
              if token in cad:
                  raise SystemExit(f'Legacy helper was incorrectly widened: {token}')
          for name, src in [('SmartCadCanvasView', smart), ('ChobYarShaprCanvasView', chob)]:
              for token in ('java.lang.reflect.Field', 'java.lang.reflect.Method', 'getDeclaredField', 'getDeclaredMethod'):
                  if token in src:
                      raise SystemExit(f'{name} still uses reflection token: {token}')
          if 'coreFindHit(wx, wy)' not in smart:
              raise SystemExit('Smart selection is not routed through coreFindHit')
          if 'smartSelectionSnapshot()' not in chob:
              raise SystemExit('ChobYarShaprCanvasView is not using Smart selection contract')
          if 'coreSaveUndo();' not in smart or 'coreSaveUndo();' not in chob:
              raise SystemExit('Undo is not routed through the Sketch core contract')
          print('Collision-safe Sketch core source contract validated')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build emulator-compatible debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar3D-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ChobYar UI smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 .github/scripts/emulator_smoke.py

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-emulator-smoke-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Persist refactor smoke result
        if: always() && github.ref == 'refs/heads/refactor/sketch-core-type-safe-20260820'
        env:
          CHOBYAR_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p docs
          printf 'status=%s\nsource_sha=%s\nworkflow_run=%s\n' "$CHOBYAR_JOB_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > docs/sketch-core-smoke-status.txt
          git config user.name "chobyar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs/sketch-core-smoke-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Sketch core smoke result [skip ci]"
            git push origin HEAD:refactor/sketch-core-type-safe-20260820
          fi
