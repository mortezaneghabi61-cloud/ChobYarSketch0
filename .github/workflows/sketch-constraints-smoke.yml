name: Sketch Constraint Solver Test

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-sketch-constraints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sketch-constraints:
    name: Persistent Sketch constraints on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHOBYAR_VERSION_CODE: 30${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.constraints.${{ github.run_number }}
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          echo "EXACT_HEAD_VERIFIED=$actual"

      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          event_head='${{ github.event.pull_request.head.sha }}'
          test "$EXPECTED_HEAD_SHA" = "$event_head"
          test "$actual" = "$event_head"
          echo "EXACT_PR_HEAD_VERIFIED=$actual"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run persistent constraint and command-selection contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SmartCommandSelectionInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/command-selection-instrumentation.txt
            grep -q 'OK (1 test)' test-artifacts/command-selection-instrumentation.txt
            adb logcat -d -v brief | grep 'SmartCommandSelection.*COMMAND_SELECTION_RESULT' | tail -n 1 | sed -E 's/^.*COMMAND_SELECTION_RESULT /COMMAND_SELECTION_RESULT /' | tee test-artifacts/command-selection-result.txt
            grep -q '^COMMAND_SELECTION_RESULT selected=true smartCount=1 newest=true$' test-artifacts/command-selection-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SketchConstraintSolverInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/sketch-constraints-instrumentation.txt
            grep -q 'OK (5 tests)' test-artifacts/sketch-constraints-instrumentation.txt
            adb logcat -d -v brief | grep 'SketchConstraintSolver.*_RESULT' | sed -E 's/^.*(AXIS_RELATION_RESULT|POINT_RELATION_RESULT|EQUAL_CONCENTRIC_RESULT|TANGENT_SYMMETRY_RESULT|LOCK_RESULT)/\1/' | tee test-artifacts/sketch-constraints-result.txt
            test $(grep -c '_RESULT' test-artifacts/sketch-constraints-result.txt) -eq 5
            grep -q '^AXIS_RELATION_RESULT horizontal=true parallel=true perpendicular=true persistent=true$' test-artifacts/sketch-constraints-result.txt
            grep -q '^POINT_RELATION_RESULT coincident=true midpoint=true persistent=true$' test-artifacts/sketch-constraints-result.txt
            grep -q '^EQUAL_CONCENTRIC_RESULT lineEqual=true radiusEqual=true concentric=true persistent=true$' test-artifacts/sketch-constraints-result.txt
            grep -q '^TANGENT_SYMMETRY_RESULT tangent=true symmetry=true persistent=true$' test-artifacts/sketch-constraints-result.txt
            grep -q '^LOCK_RESULT blockedMove=true blockedDimension=true unlockMove=true modelOwned=true$' test-artifacts/sketch-constraints-result.txt

      - name: Upload constraint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-sketch-constraint-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
