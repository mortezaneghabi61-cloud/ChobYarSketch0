name: Apply Exact Face Topology Patch

on:
  push:
    branches:
      - feature/exact-face-topology-20260820
    paths:
      - .github/scripts/apply-exact-face-topology.py
      - .github/workflows/apply-exact-face-topology.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply-exact-face-topology.py
      - .github/workflows/apply-exact-face-topology.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exact-face-topology-20260820
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact face topology patch
        run: python3 .github/scripts/apply-exact-face-topology.py

      - name: Commit generated source and regression changes
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/occt_brep_jni.cpp \
                  app/src/main/java/ir/chobyar/sketch/NativeBRepKernel.java \
                  app/src/main/java/ir/chobyar/sketch/OcctTopologyRef.java \
                  app/src/androidTest/java/ir/chobyar/sketch/ExactFaceTopologyInstrumentationTest.java \
                  .github/scripts/run-production-cad-regression.sh \
                  .github/workflows/manual26100-consolidated-regression.yml \
                  .github/workflows/solid-command-smoke.yml
          git commit -m "Add exact OCCT face topology descriptors and rematching"
          git push origin HEAD:feature/exact-face-topology-20260820
