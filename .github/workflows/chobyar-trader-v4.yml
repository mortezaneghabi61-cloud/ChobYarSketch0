name: ChobYar Trader Legacy v4 Freeze Gate

on:
  pull_request:
    paths:
      - 'ops/chobyar-trader/**'
      - '.github/workflows/chobyar-trader-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-v4-freeze:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FROZEN_V4_TREE: b4b7cddde55cf683b42a31b24bd598ce2c78abb2
      V5: ops/chobyar-trader/v5/execution_safety
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head lock
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: v4 is frozen legacy only
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:ops/chobyar-trader/v4)" = "$FROZEN_V4_TREE"
          grep -q 'frozen legacy reference' ops/chobyar-trader/v4/README.md
          grep -q 'not.*execution-authority path' ops/chobyar-trader/v4/README.md
      - name: Authoritative v5 paper runtime compiles
        run: |
          python3 -m py_compile "$V5"/*.py
          bash -n ops/chobyar-trader/upgrade-v56-v5-runtime-cutover.sh
      - name: Authoritative v5 deterministic safety tests
        env:
          PYTHONPATH: ops/chobyar-trader/v5/execution_safety
        run: |
          python3 "$V5/test_entry_gate_v55.py" -v
          python3 "$V5/test_live_safety.py" -v
          python3 "$V5/test_wallex_readonly.py" -v
          python3 "$V5/test_order_dryrun.py" -v
          python3 "$V5/test_market_metadata.py" -v
          python3 "$V5/test_auth_preflight.py" -v
          python3 "$V5/test_open_orders_readonly.py" -v
          python3 "$V5/test_quote_cap.py" -v
      - name: v5 runtime authority and fail-closed contract
        run: |
          set -Eeuo pipefail
          script=ops/chobyar-trader/upgrade-v56-v5-runtime-cutover.sh
          grep -q 'WorkingDirectory=/opt/chobyar-trader/app/v5/execution_safety' "$script"
          grep -q 'ExecStart=/opt/chobyar-trader/.venv/bin/python /opt/chobyar-trader/app/v5/execution_safety/trader_entry.py' "$script"
          grep -q 'TRADING_MODE=paper' "$script"
          grep -q 'LIVE_TRADING_ENABLED=false' "$script"
          if grep -RniE '\.post\(|\.put\(|\.patch\(|\.delete\(|/v1/account/orders|submit_order|create_order|place_order|cancel_order|withdraw\(|margin_order|futures_order|LIVE_TRADING_ENABLED[=:][[:space:]]*true' "$V5" --include='*.py'; then
            echo 'Forbidden mutable or live execution surface detected in authoritative v5 runtime' >&2
            exit 1
          fi
