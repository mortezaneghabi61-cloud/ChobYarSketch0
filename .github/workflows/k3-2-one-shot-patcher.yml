name: K3.2 One-shot Stable ID Bridge

on:
  push:
    branches: [k3-2-legacy-stable-id-bridge]
    paths:
      - "scripts/apply_k3_2_stable_id_bridge.py"
      - ".github/workflows/k3-2-one-shot-patcher.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-2-legacy-stable-id-bridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply deterministic K3.2 patch
        run: python scripts/apply_k3_2_stable_id_bridge.py

      - name: Diff sanity
        run: git diff --check

      - name: Focused Sketch Core tests
        run: ./gradlew :app:testDebugUnitTest --tests 'ir.chobyar.sketch.core.*' --no-daemon

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Commit product changes
        run: |
          git config user.name "chobyar-supervisor"
          git config user.email "chobyar-supervisor@users.noreply.github.com"
          git add app/src/main/java/ir/chobyar/sketch/CadCanvasView.java app/src/androidTest/java/ir/chobyar/sketch/ProjectPersistenceInstrumentationTest.java
          git commit -m "K3.2: add stable legacy sketch identities and persistence bridge"
          git push origin HEAD:k3-2-legacy-stable-id-bridge
