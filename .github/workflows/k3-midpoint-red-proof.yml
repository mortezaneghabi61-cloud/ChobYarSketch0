name: K3.6d MIDPOINT RED Proof

on:
  pull_request:
    paths:
      - 'app/src/androidTest/java/ir/chobyar/sketch/K36dProductionMidpointDrawAuthorityInstrumentationTest.java'
      - '.github/workflows/k3-midpoint-red-proof.yml'

permissions:
  contents: read

jobs:
  midpoint-red:
    name: Production MIDPOINT draw authority RED on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CHOBYAR_VERSION_CODE: 12${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.1.k36d.red.${{ github.run_number }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_HEAD_SHA}"
          echo "actual=${actual}"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$actual" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore reproducible development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build production and instrumentation APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run production MIDPOINT draw authority regression
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dProductionMidpointDrawAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k36d-production-midpoint-draw.txt
            grep -q 'OK (1 test)' test-artifacts/k36d-production-midpoint-draw.txt

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k36d-midpoint-red-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
