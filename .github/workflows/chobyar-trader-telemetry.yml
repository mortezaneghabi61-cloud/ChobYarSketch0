name: ChobYar Trader Telemetry Monitor

on:
  pull_request:
    paths:
      - '.github/scripts/trader_telemetry_contract.py'
      - '.github/scripts/test_trader_telemetry_contract.py'
      - '.github/workflows/chobyar-trader-telemetry.yml'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/trader_telemetry_contract.py'
      - '.github/scripts/test_trader_telemetry_contract.py'
      - '.github/workflows/chobyar-trader-telemetry.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Test fail-closed telemetry heartbeat contract
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/trader_telemetry_contract.py \
            .github/scripts/test_trader_telemetry_contract.py
          PYTHONPATH=.github/scripts python3 -B \
            .github/scripts/test_trader_telemetry_contract.py -v
      - name: Enforce monitoring-only surface
        run: |
          set -Eeuo pipefail
          files=(
            .github/scripts/trader_telemetry_contract.py
            .github/scripts/test_trader_telemetry_contract.py
          )
          if grep -RniE 'submit_order|create_order|place_order|withdraw|LIVE_TRADING_ENABLED=true|/api/v5/trade/|martingale|leverage|proxy|vpn' "${files[@]}"; then
            echo 'Forbidden execution, risk, or bypass surface found' >&2
            exit 1
          fi
      - name: Probe deployed sanitized VPS heartbeat
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
            'https://109.122.247.214/public-report' \
            -o report.json
          python3 -B .github/scripts/trader_telemetry_contract.py report.json

  poll:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact monitored revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Fetch and validate sanitized VPS heartbeat
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 2 --connect-timeout 8 --max-time 20 \
            'https://109.122.247.214/public-report' \
            -o report.json
          python3 -B .github/scripts/trader_telemetry_contract.py report.json
