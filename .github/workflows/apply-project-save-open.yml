name: Apply Project Save Open Patch

on:
  push:
    branches:
      - feature/project-save-open-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-project-persistence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-save-open-20260821
      - name: Apply explicit persistence APIs and SAF wiring
        run: python .github/scripts/apply-project-save-open.py
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ir/chobyar/sketch/CadCanvasView.java app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          git commit -m "Wire safe project Save/Open into production workspace"
          git push origin HEAD:feature/project-save-open-20260821
