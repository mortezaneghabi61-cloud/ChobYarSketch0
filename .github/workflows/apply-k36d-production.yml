name: K3.6d preflight

on:
  push:
    branches: [k3-6d-coincident-point-authority]
    paths:
      - '.github/workflows/apply-k36d-production.yml'

jobs:
  compile-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6d-coincident-point-authority
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production and Android tests; run JVM tests
        run: ./gradlew testDebugUnitTest compileDebugJavaWithJavac compileDebugAndroidTestJavaWithJavac --stacktrace
