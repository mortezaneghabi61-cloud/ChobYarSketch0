name: Apply K3.6d production authority

on:
  push:
    branches: [k3-6d-coincident-point-authority]
    paths:
      - '.github/workflows/apply-k36d-production.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6d-coincident-point-authority
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Correct K3.6d test assertion applicator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply-k36d-production.py')
          lines=p.read_text().splitlines()
          out=[]
          found=False
          for line in lines:
              if 'distanceTo(new SketchGeometry.Point(10,0))' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  out.append(indent+'SketchGeometry.Line solved=(SketchGeometry.Line)d.entity("new");')
                  out.append(indent+'assertEquals(10,solved.a.xMm,1e-9); assertEquals(0,solved.a.yMm,1e-9);')
                  found=True
              else:
                  out.append(line)
          if not found:
              raise SystemExit('distanceTo assertion anchor missing')
          p.write_text('\n'.join(out)+'\n')
          Path('.github/scripts/fix-k36d-applicator.py').unlink(missing_ok=True)
          PY
      - name: Apply K3.6d model-authority slice
        run: python3 .github/scripts/apply-k36d-production.py
      - name: Verify JVM contracts and Android compilation
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Commit coherent K3.6d slice
        run: |
          git config user.name 'chobyar-sketch-authority'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'K3.6d: model-authoritative Coincident and Point-on-Entity'
          git push origin HEAD:k3-6d-coincident-point-authority
