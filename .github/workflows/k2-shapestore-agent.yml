name: K2 ShapeStore Agent

on:
  push:
    branches:
      - cad-kernel-v2-k2-shapestore
    paths:
      - .github/workflows/k2-shapestore-agent.yml

permissions:
  contents: write

concurrency:
  group: k2-shapestore-agent
  cancel-in-progress: false

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHOBYAR_VERSION_CODE: '26082902'
      CHOBYAR_VERSION_NAME: '0.5.k2-shapestore'
      CHOBYAR_OCCT_ROOT: ${{ github.workspace }}/.occt/install-arm64

    steps:
      - name: Checkout bounded implementation branch
        uses: actions/checkout@v4
        with:
          ref: cad-kernel-v2-k2-shapestore
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android and native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache OCCT 8 Android arm64
        uses: actions/cache@v4
        with:
          path: .occt/install-arm64
          key: occt-v8.0.0-d3056ef80c9668f395da40f5fd7be186cae4501f-android26-arm64-ndk27-step-stl1

      - name: Build or restore exact OCCT backend
        run: bash .github/scripts/build_occt_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Apply bounded ShapeStore refactor
        run: |
          set -euo pipefail
          python3 .github/scripts/k2_shapestore_agent.py
          git diff --check
          git diff -- app/src/main/cpp/CMakeLists.txt app/src/main/cpp/occt_brep_jni.cpp app/src/main/cpp/shape_store.h app/src/main/cpp/shape_store.cpp

      - name: Build and test exact-native candidate before commit
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleReleaseCandidate --stacktrace

      - name: Verify exact arm64 native library is packaged
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libchobyar_brep.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Commit only verified bounded changes
        run: |
          set -euo pipefail
          git config user.name "chobyar-kernel-agent"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/cpp/CMakeLists.txt \
                  app/src/main/cpp/occt_brep_jni.cpp \
                  app/src/main/cpp/shape_store.h \
                  app/src/main/cpp/shape_store.cpp
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Extract OCCT shape ownership into monotonic ShapeStore"
          git push origin HEAD:cad-kernel-v2-k2-shapestore
