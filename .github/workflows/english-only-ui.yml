name: English-only UI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  english-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "ENGLISH_ONLY_EXACT_HEAD expected=${expected} actual=${actual}"
          test "$actual" = "$expected"
      - name: Reject Persian or Arabic script in production source
        run: python3 .github/scripts/english_only_audit.py
