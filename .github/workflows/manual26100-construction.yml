name: Manual 26.100 Construction Contract

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

permissions:
  contents: read

concurrency:
  group: manual26100-construction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 36${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.manual26100.${{ github.run_number }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "CONSTRUCTION_EXACT_HEAD expected=${expected} actual=${actual}"
          test "$actual" = "$expected"
      - name: Verify persistent Construction semantics are already applied
        run: python3 .github/scripts/apply-manual26100-construction.py
      - name: Reject source mutation during validation
        run: git diff --exit-code
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Construction and Project Sketch contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.ConstructionProjectInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/manual26100-construction.txt
            grep -q 'OK (2 tests)' test-artifacts/manual26100-construction.txt
            adb logcat -d -v brief | grep 'Manual26100Sketch.*_RESULT' | sed -E 's/^.*(CONSTRUCTION_RESULT|PROJECT_SKETCH_RESULT)/\1/' | tee test-artifacts/manual26100-results.txt
            grep -q '^CONSTRUCTION_RESULT persistent=true selectable=true dxfExcluded=true undo=true redo=true' test-artifacts/manual26100-results.txt
            grep -q '^PROJECT_SKETCH_RESULT source=1 projected=1 construction=true dxfNormalLines=1' test-artifacts/manual26100-results.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-manual26100-construction-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
