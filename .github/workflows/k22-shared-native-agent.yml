name: K2.2 Shared Native Agent

on:
  push:
    branches:
      - cad-kernel-v2-k2-shared-native
    paths:
      - .github/workflows/k22-shared-native-agent.yml

permissions:
  contents: write

concurrency:
  group: k22-shared-native-agent
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@v4
        with:
          ref: cad-kernel-v2-k2-shared-native
          fetch-depth: 0

      - name: Apply deterministic shared-native split
        run: python3 .github/scripts/k22_shared_native_agent.py

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'app/src/main/cpp/CMakeLists.txt',
              'app/src/main/cpp/occt_brep_jni.cpp',
              'app/src/main/cpp/occt_kernel_services.h',
              'app/src/main/cpp/occt_kernel_services.cpp',
              'app/src/main/cpp/occt_indexed_direct.cpp',
              'app/src/main/cpp/occt_indexed_direct_extension.inc',
              'app/src/main/cpp/occt_brep_with_indexed_direct.cpp',
          }
          changed = set()
          raw = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          for line in raw.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path.startswith('.github/'):
                  continue
              changed.add(path)
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Unexpected product paths: ' + ', '.join(unexpected))
          required = {
              'app/src/main/cpp/CMakeLists.txt',
              'app/src/main/cpp/occt_brep_jni.cpp',
              'app/src/main/cpp/occt_kernel_services.h',
              'app/src/main/cpp/occt_kernel_services.cpp',
              'app/src/main/cpp/occt_indexed_direct.cpp',
              'app/src/main/cpp/occt_indexed_direct_extension.inc',
              'app/src/main/cpp/occt_brep_with_indexed_direct.cpp',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit('Expected K2.2 paths missing from diff: ' + ', '.join(missing))
          print('Bounded K2.2 diff verified:', len(changed), 'product paths')
          PY

      - name: Commit bounded product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chobyar-kernel-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            app/src/main/cpp/CMakeLists.txt \
            app/src/main/cpp/occt_brep_jni.cpp \
            app/src/main/cpp/occt_kernel_services.h \
            app/src/main/cpp/occt_kernel_services.cpp \
            app/src/main/cpp/occt_indexed_direct.cpp \
            app/src/main/cpp/occt_indexed_direct_extension.inc \
            app/src/main/cpp/occt_brep_with_indexed_direct.cpp
          git diff --cached --exit-code && { echo "No product diff to commit"; exit 1; } || true
          git commit -m "Split indexed direct edit from OCCT JNI translation unit"
          git push origin HEAD:cad-kernel-v2-k2-shared-native
