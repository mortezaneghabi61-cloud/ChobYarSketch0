name: K3.17 Apply Production Patch

on:
  push:
    branches:
      - k3-17-directional-render-authority

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='e51b4c57c448001c47d879b4dc0b47dbfbde184d'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/k317-apply-production-patch.yml'

      - name: Apply exact K3.17 production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"FAIL-CLOSED {path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          chob = 'app/src/main/java/ir/chobyar/sketch/ChobYarShaprCanvasView.java'
          k33 = 'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java'

          replace_once(chob,
          '''    /** Migration hook: model endpoint authority suppresses object-reference constraint truth. */
              protected boolean isModelEndpointConstraintAuthorityEnabled() { return false; }
          ''',
          '''    /** Migration hook: model endpoint authority suppresses object-reference constraint truth. */
              protected boolean isModelEndpointConstraintAuthorityEnabled() { return false; }

              /** K3.17: model authority consumes one-shot directional inference instead of legacy stores. */
              protected boolean isModelDirectionalConstraintAuthorityEnabled() { return false; }

              /** One-shot gesture seam; production K33 converts previous-line identity to a stable id immediately. */
              protected void onAutomaticDirectionalInferenceCommitted(
                      char axis, boolean perpendicular, Object previousLine) {}
          ''')

          replace_once(chob,
          '''    @Override
              protected void onDraw(Canvas canvas) {
                  enforceConstraints();
                  super.onDraw(canvas);
                  pruneConstraintState();
                  drawInference(canvas);
                  drawConstraintBadges(canvas);
                  drawGizmo(canvas);
              }
          ''',
          '''    @Override
              protected void onDraw(Canvas canvas) {
                  // K3.17: production model-authority draw is presentation-only.
                  if (!isModelDirectionalConstraintAuthorityEnabled()) enforceConstraints();
                  super.onDraw(canvas);
                  if (!isModelDirectionalConstraintAuthorityEnabled()) pruneConstraintState();
                  drawInference(canvas);
                  drawConstraintBadges(canvas);
                  drawGizmo(canvas);
              }
          ''')

          replace_once(chob,
          '''                if (pendingAxis == 'H' || pendingAxis == 'V') {
                              axisLocks.put(created, new AxisLock(created, pendingAxis));
                          }
                          if (pendingPerpendicular && isLine(previousLine) && previousLine != created) {
                              addRelation(previousLine, created, false);
                          }
                          // K3.6d: routed Create commits endpoint relationships in SketchDocument.
                          if (!isModelEndpointConstraintAuthorityEnabled()) detectCoincidentLinks(created);
          ''',
          '''                if (isModelDirectionalConstraintAuthorityEnabled()) {
                              onAutomaticDirectionalInferenceCommitted(
                                      pendingAxis, pendingPerpendicular, previousLine);
                          } else {
                              if (pendingAxis == 'H' || pendingAxis == 'V') {
                                  axisLocks.put(created, new AxisLock(created, pendingAxis));
                              }
                              if (pendingPerpendicular && isLine(previousLine) && previousLine != created) {
                                  addRelation(previousLine, created, false);
                              }
                          }
                          // K3.6d: routed Create commits endpoint relationships in SketchDocument.
                          if (!isModelEndpointConstraintAuthorityEnabled()) detectCoincidentLinks(created);
          ''')

          replace_once(k33,
          '''    @Override protected boolean isModelEndpointConstraintAuthorityEnabled() { return true; }
              @Override protected boolean isModelEqualConstraintAuthorityEnabled() { return true; }
          ''',
          '''    @Override protected boolean isModelEndpointConstraintAuthorityEnabled() { return true; }
              @Override protected boolean isModelDirectionalConstraintAuthorityEnabled() { return true; }
              @Override protected boolean isModelEqualConstraintAuthorityEnabled() { return true; }

              @Override protected void onAutomaticDirectionalInferenceCommitted(
                      char axis, boolean perpendicular, Object previousLine) {
                  committedDirectionalAxis = axis;
                  committedDirectionalPerpendicular = perpendicular;
                  committedDirectionalPreviousLineId = previousLine instanceof Entity
                          ? ((Entity) previousLine).stableId() : null;
              }
          ''')

          replace_once(k33,
          '''    private boolean adoptLegacyGestureCandidate(String stableId, String source) {
                  try {
          ''',
          '''    private boolean adoptLegacyGestureCandidate(String stableId, String source) {
                  char directionalAxis = committedDirectionalAxis;
                  boolean directionalPerpendicular = committedDirectionalPerpendicular;
                  String directionalPreviousLineId = committedDirectionalPreviousLineId;
                  clearCommittedDirectionalInference();
                  try {
          ''')

          replace_once(k33,
          '''            sketchDocument.addWithConstraintsAndSolve(candidate, generated, sketchConstraintSolver);
          ''',
          '''            if (candidate instanceof SketchGeometry.Line) {
                          if (directionalAxis == 'H') {
                              generated.add(SketchConstraint.horizontal(
                                      UUID.randomUUID().toString(), stableId));
                          } else if (directionalAxis == 'V') {
                              generated.add(SketchConstraint.vertical(
                                      UUID.randomUUID().toString(), stableId));
                          }
                          if (directionalPerpendicular
                                  && directionalPreviousLineId != null
                                  && !stableId.equals(directionalPreviousLineId)
                                  && sketchDocument.entity(directionalPreviousLineId) instanceof SketchGeometry.Line) {
                              generated.add(SketchConstraint.perpendicular(
                                      UUID.randomUUID().toString(), directionalPreviousLineId, stableId));
                          }
                      }

                      sketchDocument.addWithConstraintsAndSolve(candidate, generated, sketchConstraintSolver);
          ''')

          replace_once(k33,
          '''    private RoutedSnap committedCreateSnap;
          ''',
          '''    private RoutedSnap committedCreateSnap;
              private char committedDirectionalAxis;
              private boolean committedDirectionalPerpendicular;
              private String committedDirectionalPreviousLineId;

              private void clearCommittedDirectionalInference() {
                  committedDirectionalAxis = 0;
                  committedDirectionalPerpendicular = false;
                  committedDirectionalPreviousLineId = null;
              }
          ''')

          replace_once(k33,
          '''        boolean commitAttempt = isGestureCreateCommitAttempt(toolBefore, action, drawingBefore);
                  String authorityId = commitAttempt ? UUID.randomUUID().toString() : null;
          ''',
          '''        boolean commitAttempt = isGestureCreateCommitAttempt(toolBefore, action, drawingBefore);
                  if (commitAttempt) clearCommittedDirectionalInference();
                  String authorityId = commitAttempt ? UUID.randomUUID().toString() : null;
          ''')
          PY

          rm .github/workflows/k317-apply-production-patch.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            '.github/workflows/k317-apply-production-patch.yml' \
            'app/src/main/java/ir/chobyar/sketch/ChobYarShaprCanvasView.java' \
            'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java' | sort)"

      - name: Commit exact production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'K3.17: make directional inference model-owned and draw presentation-only'
          git push origin HEAD:k3-17-directional-render-authority
