name: English-only source migration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/english_only_migrate.py'
      - '.github/workflows/english-only-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependency
        run: python -m pip install --disable-pip-version-check deep-translator==1.11.4
      - name: Translate production source to English-only
        run: python .github/scripts/english_only_migrate.py
      - name: Verify English-only source
        run: python .github/scripts/english_only_audit.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git config user.name 'chobyar-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main
          git commit -m 'Migrate production source to English-only'
          git push origin HEAD:main
