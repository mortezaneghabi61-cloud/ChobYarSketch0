name: K3 Sketch Authority Parity Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/ir/chobyar/sketch/CadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/ParametricSketchCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/core/**'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K33SketchMirrorInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K34TransactionalAuthorityInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K34CreateAuthorityInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K35SnapTouchAuthorityInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K36ProductionConstraintAuthorityInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K36d*InstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K38*InstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K39*InstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K310*InstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/K311*InstrumentationTest.java'
      - '.github/workflows/k3-sketch-authority-parity.yml'

concurrency:
  group: k3-sketch-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Stable-ID and transactional authority on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHOBYAR_VERSION_CODE: 11${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.1.k3.${{ github.run_number }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "expected=${expected}"
          echo "actual=${actual}"
          test "$actual" = "$expected"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore reproducible development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build app and instrumentation APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run K3.3 through K3.11 authority regressions
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.K33SketchMirrorInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-sketch-mirror.txt
            grep -q 'OK (3 tests)' test-artifacts/k3-sketch-mirror.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K34TransactionalAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-transactional-authority.txt
            grep -q 'OK (7 tests)' test-artifacts/k3-transactional-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K34CreateAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-create-authority.txt
            grep -q 'OK (5 tests)' test-artifacts/k3-create-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K35SnapTouchAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-snap-touch-authority.txt
            grep -q 'OK (3 tests)' test-artifacts/k3-snap-touch-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36ProductionConstraintAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-production-constraint-authority.txt
            grep -q 'OK (7 tests)' test-artifacts/k3-production-constraint-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dProductionEndpointConstraintAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-production-endpoint-authority.txt
            grep -q 'OK (7 tests)' test-artifacts/k3-production-endpoint-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dMidpointAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-midpoint-authority.txt
            grep -q 'OK (1 test)' test-artifacts/k3-midpoint-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dAutoConnectionPolicyInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-auto-connection-policy.txt
            grep -q 'OK (5 tests)' test-artifacts/k3-auto-connection-policy.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dPersistenceFailureAtomicityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-persistence-failure-atomicity.txt
            grep -q 'OK (1 test)' test-artifacts/k3-persistence-failure-atomicity.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dConstraintSchemaVersionPersistenceInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-constraint-schema-version.txt
            grep -q 'OK (1 test)' test-artifacts/k3-constraint-schema-version.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dSaveOpenRelationshipHistoryInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-save-open-relationship-history.txt
            grep -q 'OK (1 test)' test-artifacts/k3-save-open-relationship-history.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K36dActivityLifecyclePersistenceInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-activity-lifecycle-persistence.txt
            grep -q 'OK (2 tests)' test-artifacts/k3-activity-lifecycle-persistence.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K38ProductionLockAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-production-lock-authority.txt
            grep -q 'OK (3 tests)' test-artifacts/k3-production-lock-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K38PointLockInteractionInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-point-lock-interaction.txt
            grep -q 'OK (4 tests)' test-artifacts/k3-point-lock-interaction.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K39PointFixedTransformInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-point-fixed-transform.txt
            grep -q 'OK (4 tests)' test-artifacts/k3-point-fixed-transform.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K310DrivingDimensionAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-driving-dimension-authority.txt
            grep -q 'OK (4 tests)' test-artifacts/k3-driving-dimension-authority.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K310DrivingDimensionActivityLifecycleInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-driving-dimension-activity-lifecycle.txt
            grep -q 'OK (1 test)' test-artifacts/k3-driving-dimension-activity-lifecycle.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.K311EqualConstraintAuthorityInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/k3-equal-constraint-authority.txt
            grep -q 'OK (3 tests)' test-artifacts/k3-equal-constraint-authority.txt

      - name: Upload K3 authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3-sketch-authority-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
