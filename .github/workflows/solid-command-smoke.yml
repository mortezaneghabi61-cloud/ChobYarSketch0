name: Production CAD Regression

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-production-cad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-cad:
    name: 42 production CAD contracts on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHOBYAR_VERSION_CODE: 51${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.cadreg.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate persisted production contracts
        shell: bash
        run: |
          set -euo pipefail
          BOOL=app/src/main/java/ir/chobyar/sketch/ParametricHistorySolidCadCanvasView.java
          DIRECT=app/src/main/java/ir/chobyar/sketch/DirectModelCadCanvasView.java
          ADVANCED=app/src/main/java/ir/chobyar/sketch/AdvancedParametricSolidCadCanvasView.java
          SPATIAL=app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          GUIDE=app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java
          NATIVE=app/src/main/java/ir/chobyar/sketch/NativeBRepKernel.java
          KERNEL=app/src/main/java/ir/chobyar/sketch/SolidCSG.java
          grep -q 'applyHistoryBooleanByIndex' "$BOOL"
          grep -q 'keepLeft' "$BOOL"
          grep -q 'keepRight' "$BOOL"
          grep -q 'FILLET3D' "$DIRECT"
          grep -q 'CHAMFER3D' "$DIRECT"
          grep -q 'SHELL3D' "$DIRECT"
          grep -q 'PUSHPULL3D' "$DIRECT"
          grep -q 'SWEEP3D' "$ADVANCED"
          grep -q 'LOFT3D' "$ADVANCED"
          grep -q 'createOffsetSketchSpace' "$SPATIAL"
          grep -q 'projectExactBodyEdges' "$GUIDE"
          grep -q 'projectSelectedBodyReference' "$GUIDE"
          grep -q 'refreshAssociativeProjectReferences' "$GUIDE"
          grep -q 'OCCT_EDGE_RECORD_SIZE' "$NATIVE"
          grep -q 'resampleClosedPreservingVertices' "$KERNEL"
          for t in \
            TouchInputContractInstrumentationTest \
            PinchZoomInstrumentationTest \
            SketchUndoRedoInstrumentationTest \
            SketchPrimitivesSnapInstrumentationTest \
            SketchConstraintSolverInstrumentationTest \
            SmartCommandSelectionInstrumentationTest \
            SolidCommandInstrumentationTest \
            BooleanCommandInstrumentationTest \
            BooleanKeepOriginalsInstrumentationTest \
            DirectFinishInstrumentationTest \
            ShellPushPullInstrumentationTest \
            SweepCommandInstrumentationTest \
            LoftCommandInstrumentationTest \
            ConstructionProjectInstrumentationTest \
            Project3DExactInstrumentationTest \
            Project3DSelectedBodyInstrumentationTest \
            AssociativeProjectProvenanceInstrumentationTest; do
              test -f "app/src/androidTest/java/ir/chobyar/sketch/${t}.java"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build production and instrumentation APKs
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee test-artifacts/production-cad-build.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run all production CAD contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p test-artifacts
            : > test-artifacts/production-cad-summary.txt
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            run_contract() {
              class="$1"
              slug="$2"
              expected="$3"
              adb logcat -c
              adb shell am instrument -w -e class "ir.chobyar.sketch.${class}" ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee "test-artifacts/${slug}-instrumentation.txt"
              grep -Fq "$expected" "test-artifacts/${slug}-instrumentation.txt"
              adb logcat -d -v brief > "test-artifacts/${slug}-logcat.txt"
              printf '%s | %s\n' "$class" "$expected" | tee -a test-artifacts/production-cad-summary.txt
            }

            # Sketch interaction, primitives, selection, dimensions and constraints: 16 tests
            run_contract TouchInputContractInstrumentationTest touch 'OK (3 tests)'
            run_contract PinchZoomInstrumentationTest pinch 'OK (1 test)'
            run_contract SketchUndoRedoInstrumentationTest sketch-undo-redo 'OK (1 test)'
            run_contract SketchPrimitivesSnapInstrumentationTest sketch-primitives 'OK (5 tests)'
            run_contract SketchConstraintSolverInstrumentationTest sketch-constraints 'OK (5 tests)'
            run_contract SmartCommandSelectionInstrumentationTest command-selection 'OK (1 test)'

            # Solid / History / Boolean / Direct modeling: 16 tests
            run_contract SolidCommandInstrumentationTest solid 'OK (2 tests)'
            run_contract BooleanCommandInstrumentationTest boolean 'OK (3 tests)'
            run_contract BooleanKeepOriginalsInstrumentationTest boolean-keep 'OK (3 tests)'
            run_contract DirectFinishInstrumentationTest direct-finish 'OK (2 tests)'
            run_contract ShellPushPullInstrumentationTest shell-pushpull 'OK (2 tests)'
            run_contract SweepCommandInstrumentationTest sweep 'OK (1 test)'
            run_contract LoftCommandInstrumentationTest loft 'OK (1 test)'

            # Construction / exact Project / selected Body / associative reference: 10 tests
            run_contract ConstructionProjectInstrumentationTest construction-project 'OK (2 tests)'
            run_contract Project3DExactInstrumentationTest project-exact 'OK (3 tests)'
            run_contract Project3DSelectedBodyInstrumentationTest project-selected 'OK (3 tests)'
            run_contract AssociativeProjectProvenanceInstrumentationTest project-associative 'OK (4 tests)'

            test "$(wc -l < test-artifacts/production-cad-summary.txt)" -eq 17
            echo 'PRODUCTION_CAD_REGRESSION OK classes=17 tests=42' | tee -a test-artifacts/production-cad-summary.txt

      - name: Upload production CAD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-production-CAD-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
