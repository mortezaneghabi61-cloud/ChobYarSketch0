name: Production CAD Regression

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

concurrency:
  group: chobyar-production-cad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-cad:
    name: 58 production CAD contracts on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHOBYAR_VERSION_CODE: 51${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.cadreg.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate persisted production contracts
        shell: bash
        run: |
          set -euo pipefail
          BOOL=app/src/main/java/ir/chobyar/sketch/ParametricHistorySolidCadCanvasView.java
          DIRECT=app/src/main/java/ir/chobyar/sketch/DirectModelCadCanvasView.java
          ADVANCED=app/src/main/java/ir/chobyar/sketch/AdvancedParametricSolidCadCanvasView.java
          SPATIAL=app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          GUIDE=app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java
          NATIVE=app/src/main/java/ir/chobyar/sketch/NativeBRepKernel.java
          INDEXED=app/src/main/java/ir/chobyar/sketch/NativeIndexedDirectKernel.java
          TOPOLOGY=app/src/main/java/ir/chobyar/sketch/OcctTopologyRef.java
          STABLE=app/src/main/java/ir/chobyar/sketch/OcctStableCadCanvasView.java
          WORKSPACE=app/src/main/java/ir/chobyar/sketch/WorkspaceController.java
          KERNEL=app/src/main/java/ir/chobyar/sketch/SolidCSG.java
          grep -q 'applyHistoryBooleanByIndex' "$BOOL"
          grep -q 'keepLeft' "$BOOL"
          grep -q 'keepRight' "$BOOL"
          grep -q 'FILLET3D' "$DIRECT"
          grep -q 'CHAMFER3D' "$DIRECT"
          grep -q 'SHELL3D' "$DIRECT"
          grep -q 'PUSHPULL3D' "$DIRECT"
          grep -q 'SWEEP3D' "$ADVANCED"
          grep -q 'LOFT3D' "$ADVANCED"
          grep -q 'createOffsetSketchSpace' "$SPATIAL"
          grep -q 'projectExactBodyEdges' "$GUIDE"
          grep -q 'projectSelectedBodyReference' "$GUIDE"
          grep -q 'refreshAssociativeProjectReferences' "$GUIDE"
          grep -q 'OCCT_EDGE_RECORD_SIZE' "$NATIVE"
          grep -q 'OCCT_FACE_RECORD_SIZE' "$NATIVE"
          grep -q 'OCCT_FACE_SPHERE' "$NATIVE"
          grep -q 'OCCT_FACE_CONE' "$NATIVE"
          grep -q 'OCCT_FACE_TORUS' "$NATIVE"
          grep -q 'occtEdgeDescriptors' "$TOPOLOGY"
          grep -q 'occtFaceDescriptors' "$TOPOLOGY"
          grep -q 'subshapeIndex' "$TOPOLOGY"
          test -f "$INDEXED"
          grep -q 'filletByIndex' "$INDEXED"
          grep -q 'chamferByIndex' "$INDEXED"
          grep -q 'pushPullFaceByIndex' "$INDEXED"
          grep -q 'shellByIndex' "$INDEXED"
          grep -q 'NativeIndexedDirectKernel.filletByIndex' "$STABLE"
          grep -q 'NativeIndexedDirectKernel.pushPullFaceByIndex' "$STABLE"
          grep -q 'beginBodyTransformSession' "$STABLE"
          grep -q 'handleBodyGizmoTouch' "$STABLE"
          grep -q 'beginAlignSession' "$STABLE"
          grep -q 'commitAlignSession' "$STABLE"
          grep -q 'MOVE_ROTATE' "$WORKSPACE"
          grep -q 'ALIGN' "$WORKSPACE"
          grep -q 'resampleClosedPreservingVertices' "$KERNEL"
          test -f app/src/main/cpp/occt_brep_with_indexed_direct.cpp
          test -f app/src/main/cpp/occt_indexed_direct_extension.inc
          test -f .github/scripts/run-production-cad-regression.sh
          for t in \
            TouchInputContractInstrumentationTest \
            PinchZoomInstrumentationTest \
            SketchUndoRedoInstrumentationTest \
            SketchPrimitivesSnapInstrumentationTest \
            SketchConstraintSolverInstrumentationTest \
            SmartCommandSelectionInstrumentationTest \
            SolidCommandInstrumentationTest \
            BooleanCommandInstrumentationTest \
            BooleanKeepOriginalsInstrumentationTest \
            DirectFinishInstrumentationTest \
            ShellPushPullInstrumentationTest \
            SweepCommandInstrumentationTest \
            LoftCommandInstrumentationTest \
            WorkspaceSessionInstrumentationTest \
            ConstructionProjectInstrumentationTest \
            Project3DExactInstrumentationTest \
            Project3DSelectedBodyInstrumentationTest \
            AssociativeProjectProvenanceInstrumentationTest \
            ExactEdgeTopologyInstrumentationTest \
            ExactFaceTopologyInstrumentationTest \
            ExactTopologyIndexInstrumentationTest; do
              test -f "app/src/androidTest/java/ir/chobyar/sketch/${t}.java"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build production and instrumentation APKs
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee test-artifacts/production-cad-build.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run all production CAD contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/run-production-cad-regression.sh

      - name: Upload production CAD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-production-CAD-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
