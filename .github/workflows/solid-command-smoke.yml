name: Production 3D Command Test

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-solid-commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solid-commands:
    name: Extrude Revolve History on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHOBYAR_VERSION_CODE: 31${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.solid.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run production 3D command contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SolidCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/solid-command-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/solid-command-instrumentation.txt
            adb logcat -d -v brief | grep 'SolidCommandContract.*_RESULT' | sed -E 's/^.*(EXTRUDE_RESULT|REVOLVE_RESULT)/\1/' | tee test-artifacts/solid-command-result.txt
            test $(grep -c '_RESULT' test-artifacts/solid-command-result.txt) -eq 2
            grep -q '^EXTRUDE_RESULT bodyCount=1 extents=30x80x120 history=true undo=true redo=true faces=' test-artifacts/solid-command-result.txt
            grep -q '^REVOLVE_RESULT bodyCount=1 angle=360 persistent=true faces=' test-artifacts/solid-command-result.txt

      - name: Upload 3D command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-3D-command-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
