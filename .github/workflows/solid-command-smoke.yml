name: Production 3D Command Test

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-solid-commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solid-commands:
    name: Extrude Revolve Boolean Fillet Chamfer Shell PushPull History on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHOBYAR_VERSION_CODE: 31${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.solid.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare direct Boolean implementation and exact contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/boolean-command-smoke.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow:
              raise SystemExit('Boolean patch payload not found')
          payload = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '          '
          payload = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in payload.splitlines())
          exec(compile(payload, 'boolean-command-payload', 'exec'))
          PY

      - name: Prepare direct Fillet Chamfer commands and exact contracts
        run: python3 .github/scripts/apply-direct-finish-contract.py

      - name: Prepare Shell PushPull commands and exact contracts
        run: python3 .github/scripts/apply-shell-pushpull-contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run production 3D command contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SolidCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/solid-command-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/solid-command-instrumentation.txt
            adb logcat -d -v brief | grep 'SolidCommandContract.*_RESULT' | sed -E 's/^.*(EXTRUDE_RESULT|REVOLVE_RESULT)/\1/' | tee test-artifacts/solid-command-result.txt
            test $(grep -c '_RESULT' test-artifacts/solid-command-result.txt) -eq 2
            grep -q '^EXTRUDE_RESULT bodyCount=1 extents=30x80x120 history=true undo=true redo=true faces=' test-artifacts/solid-command-result.txt
            grep -q '^REVOLVE_RESULT bodyCount=1 angle=360 persistent=true faces=' test-artifacts/solid-command-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.BooleanCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/boolean-command-instrumentation.txt
            grep -q 'OK (3 tests)' test-artifacts/boolean-command-instrumentation.txt
            adb logcat -d -v brief | grep 'BooleanCommandContract.*_RESULT' | sed -E 's/^.*(BOOLEAN_UNION_RESULT|BOOLEAN_SUBTRACT_RESULT|BOOLEAN_INTERSECT_RESULT)/\1/' | tee test-artifacts/boolean-command-result.txt
            test $(grep -c '_RESULT' test-artifacts/boolean-command-result.txt) -eq 3
            grep -q '^BOOLEAN_UNION_RESULT bodyCount=1 extents=20x100x150 history=true undo=true redo=true faces=' test-artifacts/boolean-command-result.txt
            grep -q '^BOOLEAN_SUBTRACT_RESULT bodyCount=1 extents=20x50x100 history=true faces=' test-artifacts/boolean-command-result.txt
            grep -q '^BOOLEAN_INTERSECT_RESULT bodyCount=1 extents=20x50x100 history=true faces=' test-artifacts/boolean-command-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.DirectFinishInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/direct-finish-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/direct-finish-instrumentation.txt
            adb logcat -d -v brief | grep 'DirectFinishContract.*3D_RESULT' | sed -E 's/^.*(FILLET3D_RESULT|CHAMFER3D_RESULT)/\1/' | tee test-artifacts/direct-finish-result.txt
            test $(grep -c '3D_RESULT' test-artifacts/direct-finish-result.txt) -eq 2
            grep -q '^FILLET3D_RESULT bodyCount=1 extents=20x80x100 radius=10 volume=' test-artifacts/direct-finish-result.txt
            grep -q '^CHAMFER3D_RESULT bodyCount=1 extents=20x80x100 distance=10 volume=' test-artifacts/direct-finish-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.ShellPushPullInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/shell-pushpull-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/shell-pushpull-instrumentation.txt
            adb logcat -d -v brief | grep 'ShellPushPullContract.*3D_RESULT' | sed -E 's/^.*(SHELL3D_RESULT|PUSHPULL3D_RESULT)/\1/' | tee test-artifacts/shell-pushpull-result.txt
            test $(grep -c '3D_RESULT' test-artifacts/shell-pushpull-result.txt) -eq 2
            grep -q '^SHELL3D_RESULT bodyCount=1 extents=20x80x100 wall=5 volume=' test-artifacts/shell-pushpull-result.txt
            grep -q '^PUSHPULL3D_RESULT bodyCount=1 face=TOP distance=10 extents=30x80x100 volume=' test-artifacts/shell-pushpull-result.txt

      - name: Commit verified 3D command implementations to feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          BOOL_PROD=app/src/main/java/ir/chobyar/sketch/ParametricHistorySolidCadCanvasView.java
          BOOL_TEST=app/src/androidTest/java/ir/chobyar/sketch/BooleanCommandInstrumentationTest.java
          DIRECT_PROD=app/src/main/java/ir/chobyar/sketch/DirectModelCadCanvasView.java
          FINISH_TEST=app/src/androidTest/java/ir/chobyar/sketch/DirectFinishInstrumentationTest.java
          SHELL_TEST=app/src/androidTest/java/ir/chobyar/sketch/ShellPushPullInstrumentationTest.java
          if git diff --quiet -- "$BOOL_PROD" "$BOOL_TEST" "$DIRECT_PROD" "$FINISH_TEST" "$SHELL_TEST"; then
            echo "Verified 3D command implementations already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$BOOL_PROD" "$BOOL_TEST" "$DIRECT_PROD" "$FINISH_TEST" "$SHELL_TEST"
          git commit -m "Add verified Shell and Push Pull commands [skip ci]"
          git fetch origin refactor/sketch-core-type-safe-20260820
          git rebase origin/refactor/sketch-core-type-safe-20260820
          git push origin HEAD:refactor/sketch-core-type-safe-20260820

      - name: Upload 3D command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-3D-command-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
