name: Production 3D Regression

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-production-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-3d:
    name: 11 production 3D contracts on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CHOBYAR_VERSION_CODE: 35${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.3dreg.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production commands are persisted
        shell: bash
        run: |
          set -euo pipefail
          BOOL=app/src/main/java/ir/chobyar/sketch/ParametricHistorySolidCadCanvasView.java
          DIRECT=app/src/main/java/ir/chobyar/sketch/DirectModelCadCanvasView.java
          ADVANCED=app/src/main/java/ir/chobyar/sketch/AdvancedParametricSolidCadCanvasView.java
          SPATIAL=app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java
          KERNEL=app/src/main/java/ir/chobyar/sketch/SolidCSG.java
          grep -q 'applyHistoryBooleanByIndex' "$BOOL"
          grep -q 'FILLET3D' "$DIRECT"
          grep -q 'CHAMFER3D' "$DIRECT"
          grep -q 'SHELL3D' "$DIRECT"
          grep -q 'PUSHPULL3D' "$DIRECT"
          grep -q 'SWEEP3D' "$ADVANCED"
          grep -q 'LOFT3D' "$ADVANCED"
          grep -q 'createOffsetSketchSpace' "$SPATIAL"
          grep -q 'resampleClosedPreservingVertices' "$KERNEL"
          test -f app/src/androidTest/java/ir/chobyar/sketch/SolidCommandInstrumentationTest.java
          test -f app/src/androidTest/java/ir/chobyar/sketch/BooleanCommandInstrumentationTest.java
          test -f app/src/androidTest/java/ir/chobyar/sketch/DirectFinishInstrumentationTest.java
          test -f app/src/androidTest/java/ir/chobyar/sketch/ShellPushPullInstrumentationTest.java
          test -f app/src/androidTest/java/ir/chobyar/sketch/SweepCommandInstrumentationTest.java
          test -f app/src/androidTest/java/ir/chobyar/sketch/LoftCommandInstrumentationTest.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run all production 3D contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SolidCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/solid-command-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/solid-command-instrumentation.txt
            adb logcat -d -v brief | grep 'SolidCommandContract.*_RESULT' | sed -E 's/^.*(EXTRUDE_RESULT|REVOLVE_RESULT)/\1/' | tee test-artifacts/solid-command-result.txt
            test "$(grep -c '_RESULT' test-artifacts/solid-command-result.txt)" -eq 2
            grep -q '^EXTRUDE_RESULT bodyCount=1 extents=30x80x120 history=true undo=true redo=true faces=6$' test-artifacts/solid-command-result.txt
            grep -q '^REVOLVE_RESULT bodyCount=1 angle=360 persistent=true faces=288 extents=150.00x70.00x150.00$' test-artifacts/solid-command-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.BooleanCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/boolean-command-instrumentation.txt
            grep -q 'OK (3 tests)' test-artifacts/boolean-command-instrumentation.txt
            adb logcat -d -v brief | grep 'BooleanCommandContract.*_RESULT' | sed -E 's/^.*(BOOLEAN_UNION_RESULT|BOOLEAN_SUBTRACT_RESULT|BOOLEAN_INTERSECT_RESULT)/\1/' | tee test-artifacts/boolean-command-result.txt
            test "$(grep -c '_RESULT' test-artifacts/boolean-command-result.txt)" -eq 3
            grep -q '^BOOLEAN_UNION_RESULT bodyCount=1 extents=20x100x150 history=true undo=true redo=true faces=10$' test-artifacts/boolean-command-result.txt
            grep -q '^BOOLEAN_SUBTRACT_RESULT bodyCount=1 extents=20x50x100 history=true faces=6$' test-artifacts/boolean-command-result.txt
            grep -q '^BOOLEAN_INTERSECT_RESULT bodyCount=1 extents=20x50x100 history=true faces=6$' test-artifacts/boolean-command-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.DirectFinishInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/direct-finish-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/direct-finish-instrumentation.txt
            adb logcat -d -v brief | grep 'DirectFinishContract.*3D_RESULT' | sed -E 's/^.*(FILLET3D_RESULT|CHAMFER3D_RESULT)/\1/' | tee test-artifacts/direct-finish-result.txt
            test "$(grep -c '3D_RESULT' test-artifacts/direct-finish-result.txt)" -eq 2
            grep -q '^FILLET3D_RESULT bodyCount=1 extents=20x80x100 radius=10 volume=158265.26 expected=158283.19 persistent=true faces=54$' test-artifacts/direct-finish-result.txt
            grep -q '^CHAMFER3D_RESULT bodyCount=1 extents=20x80x100 distance=10 volume=156000.00 expected=156000.00 persistent=true faces=10$' test-artifacts/direct-finish-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.ShellPushPullInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/shell-pushpull-instrumentation.txt
            grep -q 'OK (2 tests)' test-artifacts/shell-pushpull-instrumentation.txt
            adb logcat -d -v brief | grep 'ShellPushPullContract.*3D_RESULT' | sed -E 's/^.*(SHELL3D_RESULT|PUSHPULL3D_RESULT)/\1/' | tee test-artifacts/shell-pushpull-result.txt
            test "$(grep -c '3D_RESULT' test-artifacts/shell-pushpull-result.txt)" -eq 2
            grep -q '^SHELL3D_RESULT bodyCount=1 extents=20x80x100 wall=5 volume=65500.00 expected=65500.00 persistent=true faces=22$' test-artifacts/shell-pushpull-result.txt
            grep -q '^PUSHPULL3D_RESULT bodyCount=1 face=TOP distance=10 extents=30x80x100 volume=240000.00 expected=240000.00 persistent=true faces=6$' test-artifacts/shell-pushpull-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SweepCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/sweep-instrumentation.txt
            grep -q 'OK (1 test)' test-artifacts/sweep-instrumentation.txt
            adb logcat -d -v brief | grep 'SweepCommandContract.*SWEEP3D_RESULT' | sed -E 's/^.*SWEEP3D_RESULT /SWEEP3D_RESULT /' | tee test-artifacts/sweep-result.txt
            grep -q '^SWEEP3D_RESULT bodyCount=1 profile=20x10 path=100 extents=10x20x100 volume=20000.00 expected=20000.00 persistent=true faces=6$' test-artifacts/sweep-result.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.LoftCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/loft-instrumentation.txt
            grep -q 'OK (1 test)' test-artifacts/loft-instrumentation.txt
            adb logcat -d -v brief | grep 'LoftCommandContract.*LOFT3D_RESULT' | sed -E 's/^.*LOFT3D_RESULT /LOFT3D_RESULT /' | tee test-artifacts/loft-result.txt
            grep -q '^LOFT3D_RESULT bodyCount=1 lower=20x10 upper=40x20 spacing=60 extents=20x40x60 volume=28000.00 expected=28000.00 persistent=true faces=6$' test-artifacts/loft-result.txt

            printf '%s\n' 'PRODUCTION_3D_REGRESSION OK tests=11' | tee test-artifacts/production-3d-summary.txt

      - name: Upload production 3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-production-3D-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
