name: ChobYar Trader v5 Execution Safety Regression

on:
  pull_request:
    paths:
      - 'ops/chobyar-trader/v5/execution_safety/**'
      - '.github/workflows/chobyar-trader-v5-execution-safety-stage8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-execution-safety-regression:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      V5: ops/chobyar-trader/v5/execution_safety
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head lock
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Frozen v4 reference remains unchanged
        run: test "$(git rev-parse HEAD:ops/chobyar-trader/v4)" = "b4b7cddde55cf683b42a31b24bd598ce2c78abb2"
      - name: Compile authoritative v5 execution safety
        run: python3 -m py_compile "$V5"/*.py
      - name: Deterministic v5 safety regressions
        env:
          PYTHONPATH: ops/chobyar-trader/v5/execution_safety
        run: |
          python3 "$V5/test_live_safety.py" -v
          python3 "$V5/test_wallex_readonly.py" -v
          python3 "$V5/test_order_dryrun.py" -v
          python3 "$V5/test_market_metadata.py" -v
          python3 "$V5/test_auth_preflight.py" -v
          python3 "$V5/test_open_orders_readonly.py" -v
          python3 "$V5/test_quote_cap.py" -v
          python3 "$V5/test_entry_gate_v55.py" -v
          python3 "$V5/test_quote_order_preflight.py" -v
          test ! -f "$V5/test_authenticated_quote_preflight.py" || python3 "$V5/test_authenticated_quote_preflight.py" -v
          test ! -f "$V5/test_live_executor_stage22.py" || python3 "$V5/test_live_executor_stage22.py" -v
          test ! -f "$V5/test_live_position_guardian_stage23.py" || python3 "$V5/test_live_position_guardian_stage23.py" -v
      - name: Fail-closed exchange surfaces outside governed Stage 22 and 23
        run: |
          set -Eeuo pipefail
          pattern='\.post\(|\.put\(|\.patch\(|\.delete\(|/v1/account/orders|submit_order|create_order|place_order|cancel_order|withdraw\(|margin_order|futures_order|LIVE_TRADING_ENABLED[=:][[:space:]]*true'
          mapfile -d '' files < <(find "$V5" -maxdepth 1 -type f -name '*.py' \
            ! -name 'live_executor_stage22.py' \
            ! -name 'test_live_executor_stage22.py' \
            ! -name 'live_position_guardian_stage23.py' \
            ! -name 'test_live_position_guardian_stage23.py' -print0)
          if ((${#files[@]})) && grep -niE "$pattern" "${files[@]}"; then
            echo 'Forbidden mutable or live execution surface detected outside governed Stage-22/23 surfaces' >&2
            exit 1
          fi
          if [[ -f "$V5/live_executor_stage22.py" ]]; then
            test -f .github/workflows/chobyar-trader-v5-live-executor-stage22.yml
            test "$(grep -Ec 'client\.post\(ORDER_PATH' "$V5/live_executor_stage22.py")" = 1
            ! grep -nEi '\.delete\(|\.put\(|\.patch\(|withdraw\(|/margin|/otc|futures' "$V5/live_executor_stage22.py"
            grep -q 'APPROVED_MAX_ORDER_USDT = Decimal("10")' "$V5/live_executor_stage22.py"
          fi
          if [[ -f "$V5/live_position_guardian_stage23.py" ]]; then
            test -f .github/workflows/chobyar-trader-v5-spot-risk-guardian-stage23.yml
            test "$(grep -Ec 'client\.post\(ORDER_PATH' "$V5/live_position_guardian_stage23.py")" = 1
            ! grep -nEi '\.delete\(|\.put\(|\.patch\(|withdraw\(|/margin|/otc|futures' "$V5/live_position_guardian_stage23.py"
            grep -q '"side": "SELL"' "$V5/live_position_guardian_stage23.py"
            ! grep -q '"side": "BUY"' "$V5/live_position_guardian_stage23.py"
            grep -q 'entry_exceeded_approved_10_usdt_cap' "$V5/live_position_guardian_stage23.py"
            grep -q 'btc_balance_exceeds_entry_quantity' "$V5/live_position_guardian_stage23.py"
          fi
      - name: v5 authority marker
        run: |
          grep -q 'authoritative v5 execution-safety surface' "$V5/README.md"
          grep -q 'does not grant live-order authority' "$V5/README.md"
