name: K3.6d midpoint and guide authority fix

on:
  push:
    branches:
      - k3-6d-coincident-point-authority
    paths:
      - .github/workflows/k36d-midpoint-guide-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6d-coincident-point-authority
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply model-owned midpoint and source-aware guide authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old_lines, new_lines, label):
              p = Path(path)
              s = p.read_text()
              old = "\n".join(old_lines)
              new = "\n".join(new_lines)
              if old not in s:
                  raise SystemExit(label + ' anchor missing')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/SketchConstraint.java',
              ['        COINCIDENT,', '        POINT_ON_ENTITY,', '        HORIZONTAL,'],
              ['        COINCIDENT,', '        POINT_ON_ENTITY,', '        MIDPOINT,', '        HORIZONTAL,'],
              'constraint enum')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/SketchConstraint.java',
              ['    public static SketchConstraint pointOnEntity(String id, String pointOwner, int pointIndex, String hostEntity) {',
               '        return new SketchConstraint(id, Kind.POINT_ON_ENTITY, pointOwner, pointIndex, hostEntity, -1, Double.NaN, true);',
               '    }',
               ''],
              ['    public static SketchConstraint pointOnEntity(String id, String pointOwner, int pointIndex, String hostEntity) {',
               '        return new SketchConstraint(id, Kind.POINT_ON_ENTITY, pointOwner, pointIndex, hostEntity, -1, Double.NaN, true);',
               '    }',
               '',
               '    public static SketchConstraint midpoint(String id, String pointOwner, int pointIndex, String hostEntity) {',
               '        return new SketchConstraint(id, Kind.MIDPOINT, pointOwner, pointIndex, hostEntity, -1, Double.NaN, true);',
               '    }',
               ''],
              'midpoint factory')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/SketchConstraint.java',
              ['        boolean needsSecondary = kind == Kind.COINCIDENT',
               '                || kind == Kind.POINT_ON_ENTITY',
               '                || kind == Kind.PARALLEL'],
              ['        boolean needsSecondary = kind == Kind.COINCIDENT',
               '                || kind == Kind.POINT_ON_ENTITY',
               '                || kind == Kind.MIDPOINT',
               '                || kind == Kind.PARALLEL'],
              'midpoint secondary requirement')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/SketchConstraint.java',
              ['        boolean pointConstraint = kind == Kind.COINCIDENT || kind == Kind.POINT_ON_ENTITY;'],
              ['        boolean pointConstraint = kind == Kind.COINCIDENT || kind == Kind.POINT_ON_ENTITY',
               '                || kind == Kind.MIDPOINT;'],
              'midpoint point-shape')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/SketchConstraint.java',
              ['        if (kind == Kind.POINT_ON_ENTITY && secondaryPointIndex >= 0) {',
               '            throw new IllegalArgumentException("POINT_ON_ENTITY host uses whole entity");',
               '        }'],
              ['        if ((kind == Kind.POINT_ON_ENTITY || kind == Kind.MIDPOINT) && secondaryPointIndex >= 0) {',
               '            throw new IllegalArgumentException(kind + " host uses whole entity");',
               '        }'],
              'midpoint host point-index')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/DeterministicSketchConstraintSolver.java',
              ['            case POINT_ON_ENTITY:',
               '                if (!(a instanceof SketchGeometry.Line) || !isPointHost(b)) {',
               '                    return "POINT_ON_ENTITY requires a line endpoint and line/circle/arc host";',
               '                }'],
              ['            case MIDPOINT:',
               '                if (!(a instanceof SketchGeometry.Line) || !(b instanceof SketchGeometry.Line)) {',
               '                    return "MIDPOINT requires a line endpoint and line host";',
               '                }',
               '                if (isDegenerateLine((SketchGeometry.Line) b)) {',
               '                    return "MIDPOINT requires a non-degenerate line host";',
               '                }',
               '                return validEndpoint(c.primaryPointIndex)',
               '                        ? null : "MIDPOINT requires endpoint index 0 or 1";',
               '            case POINT_ON_ENTITY:',
               '                if (!(a instanceof SketchGeometry.Line) || !isPointHost(b)) {',
               '                    return "POINT_ON_ENTITY requires a line endpoint and line/circle/arc host";',
               '                }'],
              'solver midpoint validation')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/DeterministicSketchConstraintSolver.java',
              ['            case POINT_ON_ENTITY: {',
               '                SketchGeometry.Line owner = line(entities, c.primaryEntityId);',
               '                SketchEntity host = entities.get(c.secondaryEntityId);'],
              ['            case MIDPOINT: {',
               '                SketchGeometry.Line owner = line(entities, c.primaryEntityId);',
               '                SketchGeometry.Line host = line(entities, c.secondaryEntityId);',
               '                SketchGeometry.Point target = new SketchGeometry.Point(',
               '                        (host.a.xMm + host.b.xMm) * 0.5,',
               '                        (host.a.yMm + host.b.yMm) * 0.5);',
               '                entities.put(c.primaryEntityId,',
               '                        withEndpoint(owner, c.primaryPointIndex, target));',
               '                break;',
               '            }',
               '            case POINT_ON_ENTITY: {',
               '                SketchGeometry.Line owner = line(entities, c.primaryEntityId);',
               '                SketchEntity host = entities.get(c.secondaryEntityId);'],
              'solver midpoint apply')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/core/DeterministicSketchConstraintSolver.java',
              ['            case POINT_ON_ENTITY: {',
               '                SketchEntity host = entities.get(c.secondaryEntityId);',
               '                SketchGeometry.Point p = endpoint(a, c.primaryPointIndex);',
               '                return distance(p, projectToEntity(host, p));',
               '            }'],
              ['            case MIDPOINT: {',
               '                SketchGeometry.Line host = line(entities, c.secondaryEntityId);',
               '                SketchGeometry.Point p = endpoint(a, c.primaryPointIndex);',
               '                SketchGeometry.Point mid = new SketchGeometry.Point(',
               '                        (host.a.xMm + host.b.xMm) * 0.5,',
               '                        (host.a.yMm + host.b.yMm) * 0.5);',
               '                return distance(p, mid);',
               '            }',
               '            case POINT_ON_ENTITY: {',
               '                SketchEntity host = entities.get(c.secondaryEntityId);',
               '                SketchGeometry.Point p = endpoint(a, c.primaryPointIndex);',
               '                return distance(p, projectToEntity(host, p));',
               '            }'],
              'solver midpoint residual')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/ParametricSketchCanvasView.java',
              ['    /** True only after a subclass has migrated endpoint constraints to SketchDocument authority. */',
               '    protected boolean isModelEndpointConstraintAuthorityEnabled() { return false; }'],
              ['    /** True only after a subclass has migrated endpoint constraints to SketchDocument authority. */',
               '    protected boolean isModelEndpointConstraintAuthorityEnabled() { return false; }',
               '',
               '    /** Model-authority routing needs the real user Auto Constraints setting. */',
               '    protected boolean isAutoConstraintsEnabled() { return autoConstraints; }',
               '',
               '    /** Instrumentation seam; production UI still toggles the same field through Constraint Settings. */',
               '    public void setAutoConstraintsEnabledForTest(boolean enabled) { autoConstraints = enabled; }'],
              'auto-constraint getter')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['                case COINCIDENT:',
               '                case POINT_ON_ENTITY: score += 100; break;'],
              ['                case COINCIDENT:',
               '                case POINT_ON_ENTITY:',
               '                case MIDPOINT: score += 100; break;'],
              'midpoint authority score')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['                    && c.kind != SketchConstraint.Kind.COINCIDENT',
               '                    && c.kind != SketchConstraint.Kind.POINT_ON_ENTITY) continue;'],
              ['                    && c.kind != SketchConstraint.Kind.COINCIDENT',
               '                    && c.kind != SketchConstraint.Kind.POINT_ON_ENTITY',
               '                    && c.kind != SketchConstraint.Kind.MIDPOINT) continue;'],
              'midpoint replay set')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['                    if (snap.modelKind == SketchSnapService.Kind.ENDPOINT && snap.targetPointIndex >= 0) {',
               '                        generated.add(SketchConstraint.coincident(UUID.randomUUID().toString(),',
               '                                stableId, drivenPoint, snap.targetEntityId, snap.targetPointIndex));',
               '                    } else if (snap.modelKind == SketchSnapService.Kind.ON_EDGE) {',
               '                        generated.add(SketchConstraint.pointOnEntity(UUID.randomUUID().toString(),',
               '                                stableId, drivenPoint, snap.targetEntityId));',
               '                    }'],
              ['                    if (snap.modelKind == SketchSnapService.Kind.ENDPOINT && snap.targetPointIndex >= 0) {',
               '                        generated.add(SketchConstraint.coincident(UUID.randomUUID().toString(),',
               '                                stableId, drivenPoint, snap.targetEntityId, snap.targetPointIndex));',
               '                    } else if (snap.modelKind == SketchSnapService.Kind.MIDPOINT) {',
               '                        generated.add(SketchConstraint.midpoint(UUID.randomUUID().toString(),',
               '                                stableId, drivenPoint, snap.targetEntityId));',
               '                    } else if (snap.modelKind == SketchSnapService.Kind.ON_EDGE && isAutoConstraintsEnabled()) {',
               '                        generated.add(SketchConstraint.pointOnEntity(UUID.randomUUID().toString(),',
               '                                stableId, drivenPoint, snap.targetEntityId));',
               '                    }'],
              'midpoint create relationship')

          marker = '    private RoutedSnap modelGuideGridSnap(float rawX, float rawY, float radiusMm) {'
          p = Path('app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java')
          s = p.read_text()
          helper = "\n".join([
              '    private RoutedSnap modelLineExtensionGuideSnap(float rawX, float rawY, float radiusMm) {',
              '        RoutedSnap best = null;',
              '        for (SketchEntity value : sketchDocument.entities()) {',
              '            if (!(value instanceof SketchGeometry.Line)) continue;',
              '            SketchGeometry.Line line = (SketchGeometry.Line) value;',
              '            double dx = line.b.xMm - line.a.xMm;',
              '            double dy = line.b.yMm - line.a.yMm;',
              '            double l2 = dx * dx + dy * dy;',
              '            if (l2 <= 1.0e-12) continue;',
              '            double t = ((rawX - line.a.xMm) * dx + (rawY - line.a.yMm) * dy) / l2;',
              '            if (t >= 0.0 && t <= 1.0) continue;',
              '            double px = line.a.xMm + t * dx;',
              '            double py = line.a.yMm + t * dy;',
              '            double d = Math.hypot(px - rawX, py - rawY);',
              '            if (d <= radiusMm * GUIDE_RADIUS_FACTOR',
              '                    && (best == null || d < best.distanceMm)) {',
              '                best = new RoutedSnap(px, py, d, "Guide",',
              '                        SketchSnapService.Kind.ON_EDGE, line.id(), -1);',
              '            }',
              '        }',
              '        return best;',
              '    }',
              ''
          ])
          if marker not in s:
              raise SystemExit('guide helper insertion anchor missing')
          p.write_text(s.replace(marker, helper + marker, 1))

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['        if (isShowGuides()) {',
               '            for (Entity entity : entities) {'],
              ['        if (isShowGuides()) {',
               '            RoutedSnap extension = modelLineExtensionGuideSnap(rawX, rawY, radiusMm);',
               '            if (extension != null && (best == null || extension.distanceMm < best.distanceMm)) {',
               '                best = extension;',
               '            }',
               '            for (Entity entity : entities) {'],
              'guide source-aware candidate')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['                if (d <= radiusMm * GUIDE_RADIUS_FACTOR',
               '                        && (best == null || d < best.distanceMm)) {',
               '                    best = new RoutedSnap(p.x, p.y, d, "Guide", null, null, -1);',
               '                }'],
              ['                if (d <= radiusMm * GUIDE_RADIUS_FACTOR && best == null) {',
               '                    best = new RoutedSnap(p.x, p.y, d, "Guide", null, null, -1);',
               '                }'],
              'anonymous guide fallback')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['            if (action == MotionEvent.ACTION_UP',
               '                    && (snap.modelKind == SketchSnapService.Kind.ENDPOINT',
               '                        || snap.modelKind == SketchSnapService.Kind.ON_EDGE)',
               '                    && snap.targetEntityId != null) {',
               '                committedCreateSnap = snap;',
               '            }'],
              ['            boolean automaticRelationship = snap.modelKind == SketchSnapService.Kind.ENDPOINT',
               '                    || snap.modelKind == SketchSnapService.Kind.MIDPOINT',
               '                    || (snap.modelKind == SketchSnapService.Kind.ON_EDGE && isAutoConstraintsEnabled());',
               '            if (action == MotionEvent.ACTION_UP && automaticRelationship',
               '                    && snap.targetEntityId != null) {',
               '                committedCreateSnap = snap;',
               '            }'],
              'auto-constraint relationship policy')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java',
              ['            String glyph = badge.kind == ModelConstraintBadgeProjection.BadgeKind.COINCIDENT ? "●" : "◇";'],
              ['            String glyph = badge.kind == ModelConstraintBadgeProjection.BadgeKind.POINT_ON_ENTITY ? "◇" : "●";'],
              'midpoint badge glyph')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/ModelConstraintBadgeProjection.java',
              ['        COINCIDENT("Coincident"),',
               '        POINT_ON_ENTITY("Point on entity");'],
              ['        COINCIDENT("Coincident"),',
               '        POINT_ON_ENTITY("Point on entity"),',
               '        MIDPOINT("Midpoint");'],
              'midpoint badge enum')

          replace_once(
              'app/src/main/java/ir/chobyar/sketch/ModelConstraintBadgeProjection.java',
              ['        } else if (constraint.kind == SketchConstraint.Kind.POINT_ON_ENTITY) {',
               '            badgeKind = BadgeKind.POINT_ON_ENTITY;',
               '        } else {'],
              ['        } else if (constraint.kind == SketchConstraint.Kind.POINT_ON_ENTITY) {',
               '            badgeKind = BadgeKind.POINT_ON_ENTITY;',
               '        } else if (constraint.kind == SketchConstraint.Kind.MIDPOINT) {',
               '            badgeKind = BadgeKind.MIDPOINT;',
               '        } else {'],
              'midpoint badge projection')

          unit_path = Path('app/src/test/java/ir/chobyar/sketch/core/K36dEndpointConstraintAuthorityTest.java')
          us = unit_path.read_text()
          unit_anchor = '\n    @Test public void danglingCreateConstraintFailsBeforeMutationOrHistory() {'
          unit_test = "\n".join([
              '',
              '    @Test public void midpointConstraintTracksHostAndHistoryAtomically() {',
              '        SketchDocument d=new SketchDocument();',
              '        d.add(line("host-mid",0,0,20,0));',
              '        d.add(line("owner-mid",7,4,7,10));',
              '        d.addConstraintsAndSolve(Collections.singletonList(',
              '                SketchConstraint.midpoint("m1","owner-mid",0,"host-mid")),',
              '                new DeterministicSketchConstraintSolver());',
              '        SketchGeometry.Line owner=(SketchGeometry.Line)d.entity("owner-mid");',
              '        assertEquals(10.0,owner.a.xMm,1e-9);',
              '        assertEquals(0.0,owner.a.yMm,1e-9);',
              '        d.selectOnly("host-mid");',
              '        d.translateSelectionAndSolve(4,6,new DeterministicSketchConstraintSolver());',
              '        owner=(SketchGeometry.Line)d.entity("owner-mid");',
              '        assertEquals(14.0,owner.a.xMm,1e-9);',
              '        assertEquals(6.0,owner.a.yMm,1e-9);',
              '        assertTrue(d.undo());',
              '        owner=(SketchGeometry.Line)d.entity("owner-mid");',
              '        assertEquals(10.0,owner.a.xMm,1e-9);',
              '        assertEquals(0.0,owner.a.yMm,1e-9);',
              '        assertTrue(d.redo());',
              '        assertEquals(1,d.constraintCount());',
              '        assertTrue(d.remove("host-mid"));',
              '        assertEquals(0,d.constraintCount());',
              '    }',
              ''
          ])
          if unit_anchor not in us:
              raise SystemExit('unit midpoint test anchor missing')
          unit_path.write_text(us.replace(unit_anchor, unit_test + unit_anchor, 1))

          it_path = Path('app/src/androidTest/java/ir/chobyar/sketch/K36dProductionEndpointConstraintAuthorityInstrumentationTest.java')
          ins = it_path.read_text()
          it_anchor = '\n    @Test public void saveOpenRetainsBothRelationshipsStableIdsAndPointIndexesButResetsSessionHistory() throws Exception {'
          it_tests = "\n".join([
              '',
              '    @Test public void midpointSnapIsDurableEvenWhenAutoConstraintsOff() throws Exception {',
              '        onMain(() -> {',
              '            K33MirroredCadCanvasView cad=canvas();',
              '            cad.executeCommand("LINE 0 0 100 0"); String hostId=cad.selected.stableId();',
              '            cad.setAutoConstraintsEnabledForTest(false);',
              '            Set<String> before=ids(cad.exportSketchProjectState());',
              '            cad.setTool(CadCanvasView.TOOL_LINE);',
              '            stroke(cad,screen(cad,20f,25f),screen(cad,50.2f,0.1f),true);',
              '            cad.requireSketchMirrorParity();',
              '            String created=onlyNewId(before,cad.exportSketchProjectState());',
              '            assertEquals("MIDPOINT",cad.sketchLastModelSnapKind());',
              '            assertEquals(1,cad.sketchConstraintCount());',
              '            SketchConstraint c=cad.sketchConstraints().get(0);',
              '            assertEquals(SketchConstraint.Kind.MIDPOINT,c.kind);',
              '            assertEquals(created,c.primaryEntityId);',
              '            assertEquals(hostId,c.secondaryEntityId);',
              '            assertPoint(modelLine(cad,created).b,50,0);',
              '            cad.undo();',
              '            cad.requireSketchMirrorParity();',
              '            assertEquals(1,entityCount(cad.exportSketchProjectState()));',
              '            assertEquals(0,cad.sketchConstraintCount());',
              '            assertTrue(cad.redoSketch());',
              '            cad.requireSketchMirrorParity();',
              '            select(cad,legacyLine(cad,hostId));',
              '            cad.moveSelected(10f,6f);',
              '            cad.requireSketchMirrorParity();',
              '            assertPoint(modelLine(cad,created).b,60,6);',
              '            String raw=cad.exportSketchProjectState();',
              '            K33MirroredCadCanvasView reopened=canvas();',
              '            reopened.importSketchProjectState(raw);',
              '            reopened.requireSketchMirrorParity();',
              '            assertEquals(SketchConstraint.Kind.MIDPOINT,reopened.sketchConstraints().get(0).kind);',
              '            assertPoint(modelLine(reopened,created).b,60,6);',
              '            return true;',
              '        });',
              '    }',
              '',
              '    @Test public void lineExtensionGuideCarriesStableHostAndCreatesPointOnEntity() throws Exception {',
              '        onMain(() -> {',
              '            K33MirroredCadCanvasView cad=canvas();',
              '            cad.executeCommand("LINE 0 0 30 0"); String hostId=cad.selected.stableId();',
              '            cad.setAutoConstraintsEnabledForTest(true);',
              '            Set<String> before=ids(cad.exportSketchProjectState());',
              '            cad.setTool(CadCanvasView.TOOL_LINE);',
              '            stroke(cad,screen(cad,10f,20f),screen(cad,45f,0.2f),true);',
              '            cad.requireSketchMirrorParity();',
              '            String created=onlyNewId(before,cad.exportSketchProjectState());',
              '            assertEquals("ON_EDGE",cad.sketchLastModelSnapKind());',
              '            assertEquals(1,cad.sketchConstraintCount());',
              '            SketchConstraint c=cad.sketchConstraints().get(0);',
              '            assertEquals(SketchConstraint.Kind.POINT_ON_ENTITY,c.kind);',
              '            assertEquals(created,c.primaryEntityId);',
              '            assertEquals(hostId,c.secondaryEntityId);',
              '            assertPoint(modelLine(cad,created).b,45,0);',
              '            cad.undo();',
              '            cad.requireSketchMirrorParity();',
              '            assertEquals(1,entityCount(cad.exportSketchProjectState()));',
              '            assertEquals(0,cad.sketchConstraintCount());',
              '            assertTrue(cad.redoSketch());',
              '            cad.requireSketchMirrorParity();',
              '            select(cad,legacyLine(cad,hostId));',
              '            cad.moveSelected(0f,5f);',
              '            cad.requireSketchMirrorParity();',
              '            assertPoint(modelLine(cad,created).b,45,5);',
              '            String raw=cad.exportSketchProjectState();',
              '            K33MirroredCadCanvasView reopened=canvas();',
              '            reopened.importSketchProjectState(raw);',
              '            reopened.requireSketchMirrorParity();',
              '            SketchConstraint restored=findKind(reopened,SketchConstraint.Kind.POINT_ON_ENTITY);',
              '            assertEquals(hostId,restored.secondaryEntityId);',
              '            select(reopened,legacyLine(reopened,hostId));',
              '            reopened.deleteSelected();',
              '            reopened.requireSketchMirrorParity();',
              '            assertEquals(0,reopened.sketchConstraintCount());',
              '            assertEquals(0,reopened.legacyMigratedConstraintTruthCount());',
              '            return true;',
              '        });',
              '    }',
              '',
              '    @Test public void autoConstraintsOffDoesNotPersistOrdinaryOnEdgeRelationship() throws Exception {',
              '        onMain(() -> {',
              '            K33MirroredCadCanvasView cad=canvas();',
              '            cad.executeCommand("LINE 0 0 100 0");',
              '            cad.setAutoConstraintsEnabledForTest(false);',
              '            cad.setTool(CadCanvasView.TOOL_LINE);',
              '            stroke(cad,screen(cad,20f,25f),screen(cad,30f,0.2f),true);',
              '            cad.requireSketchMirrorParity();',
              '            assertEquals("ON_EDGE",cad.sketchLastModelSnapKind());',
              '            assertEquals(0,cad.sketchConstraintCount());',
              '            return true;',
              '        });',
              '    }',
              ''
          ])
          if it_anchor not in ins:
              raise SystemExit('instrumentation midpoint/guide anchor missing')
          it_path.write_text(ins.replace(it_anchor, it_tests + it_anchor, 1))
          PY
      - name: Verify unit and Android instrumentation compilation
        run: ./gradlew testDebugUnitTest compileDebugJavaWithJavac compileDebugAndroidTestJavaWithJavac --stacktrace
      - name: Commit verified midpoint and guide authority and remove temporary workflow
        shell: bash
        run: |
          git config user.name chobyar-supervisor
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/k36d-midpoint-guide-fix.yml
          git add app/src/main/java/ir/chobyar/sketch/core/SketchConstraint.java \
                  app/src/main/java/ir/chobyar/sketch/core/DeterministicSketchConstraintSolver.java \
                  app/src/main/java/ir/chobyar/sketch/ParametricSketchCanvasView.java \
                  app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java \
                  app/src/main/java/ir/chobyar/sketch/ModelConstraintBadgeProjection.java \
                  app/src/test/java/ir/chobyar/sketch/core/K36dEndpointConstraintAuthorityTest.java \
                  app/src/androidTest/java/ir/chobyar/sketch/K36dProductionEndpointConstraintAuthorityInstrumentationTest.java
          git commit -m 'K3.6d: make midpoint and guide snaps model-authoritative'
          git pull --rebase origin k3-6d-coincident-point-authority
          git push origin HEAD:k3-6d-coincident-point-authority
