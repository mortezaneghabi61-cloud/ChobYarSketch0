name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: chobyar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHOBYAR_VERSION_NAME: 0.4.${{ github.run_number }}
      CHOBYAR_OCCT_ROOT: ${{ github.workspace }}/.occt/install-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set monotonic Android version code
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          test "$VERSION_CODE" -gt 1000000
          test "$VERSION_CODE" -lt 2100000000
          echo "CHOBYAR_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "android_version_code=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 + Native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache OCCT 8 Android arm64
        uses: actions/cache@v4
        with:
          path: .occt/install-arm64
          key: occt-v8.0.0-d3056ef80c9668f395da40f5fd7be186cae4501f-android26-arm64-ndk27-step-stl1

      - name: Build OCCT 8 exact B-Rep backend
        run: bash .github/scripts/build_occt_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore persistent signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build debug and signed release-candidate APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify release-candidate APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/chobyar-badging.txt
          grep -q "package: name='ir.chobyar.sketch'" /tmp/chobyar-badging.txt
          grep -q "versionCode='$CHOBYAR_VERSION_CODE'" /tmp/chobyar-badging.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar3D-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release-candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar3D-release-candidate
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish installable APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChobYar3D.apk
          gh release create "android-${{ github.run_number }}" ChobYar3D.apk \
            --target "${{ github.sha }}" \
            --title "ChobYar 3D Android ${{ env.CHOBYAR_VERSION_NAME }}" \
            --notes "Signed release-candidate Android CAD build from commit ${{ github.sha }} with monotonic versionCode $CHOBYAR_VERSION_CODE. Real-device acceptance is still required before calling this production-ready." \
            --prerelease
