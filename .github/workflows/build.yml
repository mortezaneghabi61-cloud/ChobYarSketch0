name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: skachmori-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHOBYAR_VERSION_CODE: ${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.1.${{ github.run_number }}
      CHOBYAR_OCCT_ROOT: ${{ github.workspace }}/.occt/install-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 + Native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache OCCT 8 Android arm64
        uses: actions/cache@v4
        with:
          path: .occt/install-arm64
          key: occt-v8.0.0-d3056ef80c9668f395da40f5fd7be186cae4501f-android26-arm64-ndk27-step-stl1

      - name: Build OCCT 8 exact B-Rep backend
        run: bash .github/scripts/build_occt_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore persistent signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChobYarSketch0-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChobYar3D.apk
          gh release create "android-${{ github.run_number }}" ChobYar3D.apk \
            --target "${{ github.sha }}" \
            --title "ChobYar 3D Android ${{ env.CHOBYAR_VERSION_NAME }}" \
            --notes "Automated Android CAD build from commit ${{ github.sha }}" \
            --prerelease
