name: Apply Exact Sphere Face Topology

on:
  push:
    branches:
      - feature/topology-direct-edit-20260821
    paths:
      - .github/scripts/apply-sphere-face-topology.py
      - .github/workflows/apply-sphere-face-topology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/topology-direct-edit-20260821
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply spherical exact-face extension
        run: python3 .github/scripts/apply-sphere-face-topology.py

      - name: Commit production code and regression gate
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/ir/chobyar/sketch/NativeBRepKernel.java \
            app/src/main/cpp/occt_brep_jni.cpp \
            app/src/main/java/ir/chobyar/sketch/OcctTopologyRef.java \
            app/src/androidTest/java/ir/chobyar/sketch/ExactFaceTopologyInstrumentationTest.java \
            .github/scripts/run-production-cad-regression.sh \
            .github/workflows/manual26100-consolidated-regression.yml \
            .github/workflows/solid-command-smoke.yml
          git commit -m "Add exact spherical face topology and rematching"
          git push origin HEAD:feature/topology-direct-edit-20260821
