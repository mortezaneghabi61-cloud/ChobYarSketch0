name: UI Placeholder Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/**'
      - '.github/scripts/ui_placeholder_audit.py'
      - '.github/workflows/ui-placeholder-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-placeholder-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED"
          echo "ACTUAL_HEAD=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Self-test placeholder detector
        run: python3 .github/scripts/ui_placeholder_audit.py --self-test

      - name: Require zero production UI placeholders
        run: python3 .github/scripts/ui_placeholder_audit.py
