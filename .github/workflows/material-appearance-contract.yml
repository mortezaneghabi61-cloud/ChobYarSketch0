name: Material Appearance Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadAppearanceController.java'
      - 'app/src/main/java/ir/chobyar/sketch/FilamentCadSurface.java'
      - 'app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/CadMaterialPresetInstrumentationTest.java'
      - '.github/workflows/material-appearance-contract.yml'

permissions:
  contents: read

concurrency:
  group: material-appearance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  material-appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 37${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.material.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate renderer-only appearance wiring
        run: |
          set -euo pipefail
          grep -q 'WOOD("wood"' app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java
          grep -q 'FABRIC("fabric"' app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java
          grep -q 'PLASTIC("plastic"' app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java
          grep -q 'METAL("metal"' app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java
          grep -q 'PAINT("paint"' app/src/main/java/ir/chobyar/sketch/CadMaterialPreset.java
          grep -q 'FilamentCadSurface::setAppearance' app/src/main/java/ir/chobyar/sketch/CadAppearanceController.java
          grep -q 'void setAppearance(int color,float roughness,float metallic)' app/src/main/java/ir/chobyar/sketch/FilamentCadSurface.java
          grep -q 'material.roughness' app/src/main/java/ir/chobyar/sketch/FilamentCadSurface.java
          grep -q 'material.metallic' app/src/main/java/ir/chobyar/sketch/FilamentCadSurface.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run material preset contracts on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.CadMaterialPresetInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/material-appearance.txt
            grep -q 'OK (4 tests)' test-artifacts/material-appearance.txt
      - name: Upload material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-material-appearance-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
