name: Temporary Save Open target patcher

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/enable-production-project-save-20260821' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enable-production-project-save-20260821
          fetch-depth: 0

      - name: Patch production Save Open activity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java')
          s=p.read_text()

          start=s.index('    private void saveProject(){')
          end=s.index('    private void openProject(){', start)
          s=s[:start]+"    private void saveProject(){\n        // Persist the complete non-lossy workspace: Sketch, exact 3D History\n        // and optional calibrated Reference Image.\n        Intent intent=new Intent(Intent.ACTION_CREATE_DOCUMENT);intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"application/json\");intent.putExtra(Intent.EXTRA_TITLE,\"ChobYar-Project.chobyar\");\n        startActivityForResult(intent,REQUEST_SAVE_PROJECT);\n    }\n\n"+s[end:]

          old='String json=CadProjectDocument.encodeSketch(cad.exportSketchProjectState());'
          if old not in s: raise SystemExit('legacy Save encoder anchor missing')
          s=s.replace(old,'String json=CadProjectPersistenceController.encode(cad);',1)

          marker='CadProjectDocument.Decoded decoded=CadProjectDocument.decode('
          a=s.index(marker)
          a=s.rfind('\n',0,a)+1
          b=s.index('status(result);',a)+len('status(result);')
          b=s.find('\n',b)
          if b<0: b=len(s)
          else: b+=1
          s=s[:a]+"                String raw=new String(buffer.toByteArray(),java.nio.charset.StandardCharsets.UTF_8);\n                String result=CadProjectPersistenceController.restore(cad,raw);\n                syncGpuMesh();updateWorkspaceChrome();cad.post(cad::fitAll);status(result);\n"+s[b:]
          p.write_text(s)
          PY

          git diff --check
          grep -q 'CadProjectPersistenceController.encode(cad)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -q 'CadProjectPersistenceController.restore(cad,raw)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          ! grep -q 'ذخیره پروژه 3D هنوز کامل نشده' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java

      - name: Commit production activity patch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/save-open-hotfix-patcher.yml || true
          git rm -f .github/save-open-target-trigger.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          git commit -m 'Enable non-lossy 3D project Save Open in production UI'
          git push origin HEAD:fix/enable-production-project-save-20260821
