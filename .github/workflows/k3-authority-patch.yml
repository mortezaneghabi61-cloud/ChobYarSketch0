name: K3 Authority Patch

on:
  push:
    branches: [k3-6c-main-sync]
    paths:
      - .github/workflows/k3-authority-patch.yml

permissions:
  contents: write

jobs:
  patch-authority-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6c-main-sync
          fetch-depth: 0
      - name: Repair stale View reconciliation before model rehydrate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java')
          s = p.read_text()
          old = '''    private boolean prepareTransactionalDocument(String source) {
        try {
            String raw = exportSketchProjectState();'''
          new = '''    private boolean prepareTransactionalDocument(String source) {
        try {
            // Model-owned constrained geometry is authoritative. A stale legacy
            // handle/control-point mutation must never overwrite solved model truth
            // when the next transaction rehydrates its document snapshot.
            replayAuthoritativeConstrainedGeometryBeforeDraw();
            String raw = exportSketchProjectState();'''
          if old not in s:
              raise SystemExit('prepareTransactionalDocument patch anchor not found')
          s = s.replace(old, new, 1)
          old = '''    private void reconcileLegacyTouchIfNeeded(String source) {
        try {
            String raw = exportSketchProjectState();'''
          new = '''    private void reconcileLegacyTouchIfNeeded(String source) {
        try {
            // Handle drags still pass through legacy View code during migration.
            // Restore model-owned constrained geometry before parity/re-hydration
            // so touch cannot become a second semantic authority.
            replayAuthoritativeConstrainedGeometryBeforeDraw();
            String raw = exportSketchProjectState();'''
          if old not in s:
              raise SystemExit('reconcileLegacyTouchIfNeeded patch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit authority repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'chobyar-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java
          git commit -m 'K3.6c: keep model truth across stale View mutations'
          git push origin HEAD:k3-6c-main-sync
