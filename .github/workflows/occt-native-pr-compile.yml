name: OCCT Exact Native Compile

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/occt-native-pr-compile.yml
      - .github/scripts/build_occt_android.sh
      - app/build.gradle*
      - app/src/main/cpp/**
      - app/src/main/java/ir/chobyar/sketch/NativeBRepKernel.java
      - app/src/main/java/ir/chobyar/sketch/OcctTopologyRef.java
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - .github/workflows/occt-native-pr-compile.yml
      - .github/scripts/build_occt_android.sh
      - app/build.gradle*
      - app/src/main/cpp/**
      - app/src/main/java/ir/chobyar/sketch/NativeBRepKernel.java
      - app/src/main/java/ir/chobyar/sketch/OcctTopologyRef.java

concurrency:
  group: chobyar-occt-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-exact-native:
    name: OCCT 8 arm64 exact B-Rep compile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHOBYAR_VERSION_CODE: 61${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.occtnative.${{ github.run_number }}
      CHOBYAR_OCCT_ROOT: ${{ github.workspace }}/.occt/install-arm64

    steps:
      - name: Checkout actual branch / PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache OCCT 8 Android arm64
        uses: actions/cache@v4
        with:
          path: .occt/install-arm64
          key: occt-v8.0.0-d3056ef80c9668f395da40f5fd7be186cae4501f-android26-arm64-ndk27-step-stl1

      - name: Build or restore OCCT 8 exact B-Rep backend
        run: bash .github/scripts/build_occt_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Compile APK with OCCT arm64 path enabled
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee test-artifacts/occt-native-build.txt

      - name: Verify arm64 library is OCCT-linked and packaged
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee test-artifacts/occt-apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libchobyar_brep.so' test-artifacts/occt-apk-contents.txt
          rm -rf test-artifacts/arm64-native
          mkdir -p test-artifacts/arm64-native
          unzip -j app/build/outputs/apk/debug/app-debug.apk \
            'lib/arm64-v8a/libchobyar_brep.so' -d test-artifacts/arm64-native
          readelf -d test-artifacts/arm64-native/libchobyar_brep.so \
            | tee test-artifacts/occt-arm64-needed.txt
          grep -Eq 'libTKBRep\.so|libTKernel\.so' test-artifacts/occt-arm64-needed.txt

      - name: Upload native compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-OCCT-arm64-native-compile
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
