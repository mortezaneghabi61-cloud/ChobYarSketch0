name: K3.6d degenerate host rejection contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/k36d-degenerate-contract-fix.yml'
      - 'app/src/test/java/ir/chobyar/sketch/core/K36dEndpointConstraintAuthorityTest.java'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'k3-6d-coincident-point-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6d-coincident-point-authority
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Align validation exception contract without weakening state assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/test/java/ir/chobyar/sketch/core/K36dEndpointConstraintAuthorityTest.java')
          s=p.read_text()
          old='''        } catch (IllegalStateException expected) {\n            assertTrue(expected.getMessage().contains("non-degenerate line host"));\n        }\n'''
          new='''        } catch (IllegalArgumentException expected) {\n            assertTrue(expected.getMessage().contains("non-degenerate line host"));\n        }\n'''
          if old not in s: raise SystemExit('degenerate-host exception anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify endpoint authority JVM suite and full unit regression
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Commit verified contract fix
        shell: bash
        run: |
          git config user.name chobyar-supervisor
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/k36d-degenerate-contract-fix.yml
          git add app/src/test/java/ir/chobyar/sketch/core/K36dEndpointConstraintAuthorityTest.java
          git commit -m 'test: match fail-closed endpoint validation contract'
          git pull --rebase origin k3-6d-coincident-point-authority
          git push origin HEAD:k3-6d-coincident-point-authority
