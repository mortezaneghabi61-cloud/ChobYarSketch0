name: Production Sweep Command Test

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820

concurrency:
  group: chobyar-sweep-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep Geometry and History on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHOBYAR_VERSION_CODE: 33${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.sweep.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Sweep command and exact contract
        run: python3 .github/scripts/apply-sweep-contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact Sweep contract
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.SweepCommandInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/sweep-instrumentation.txt
            grep -q 'OK (1 test)' test-artifacts/sweep-instrumentation.txt
            adb logcat -d -v brief | grep 'SweepCommandContract.*SWEEP3D_RESULT' | sed -E 's/^.*SWEEP3D_RESULT /SWEEP3D_RESULT /' | tee test-artifacts/sweep-result.txt
            grep -q '^SWEEP3D_RESULT bodyCount=1 profile=20x10 path=100 extents=10x20x100 volume=20000.00 expected=20000.00 persistent=true faces=6' test-artifacts/sweep-result.txt

      - name: Commit verified Sweep implementation to feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          PROD=app/src/main/java/ir/chobyar/sketch/AdvancedParametricSolidCadCanvasView.java
          TEST=app/src/androidTest/java/ir/chobyar/sketch/SweepCommandInstrumentationTest.java
          if git diff --quiet -- "$PROD" "$TEST"; then
            echo "Verified Sweep implementation already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PROD" "$TEST"
          git commit -m "Add verified direct Sweep command [skip ci]"
          git fetch origin refactor/sketch-core-type-safe-20260820
          git rebase origin/refactor/sketch-core-type-safe-20260820
          git push origin HEAD:refactor/sketch-core-type-safe-20260820

      - name: Upload Sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-Sweep-command-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
