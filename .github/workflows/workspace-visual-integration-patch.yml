name: Workspace Visual Integration Patch

on:
  pull_request:
    paths:
      - '.github/workflows/workspace-visual-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch-production-save-open:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Wire workspace visual state into project envelope and production UI
        run: |
          set -euo pipefail
          cat > app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java <<'JAVA'
          package ir.chobyar.sketch;

          import org.json.JSONObject;

          /**
           * Versioned on-disk project envelope.
           *
           * Schema v1 stores only the sketch/document shell. Schema v2 adds an exact-model
           * section containing logical plane/feature/topology references. Schema v3 adds
           * workspace-owned auxiliary state such as Reference Image and renderer-only
           * Materials / Section View state without contaminating exact OCCT History.
           * Older v1/v2 and earlier v3 files remain readable.
           */
          final class CadProjectDocument {
              static final String FORMAT = "chobyar-project";
              static final int SKETCH_SCHEMA_VERSION = 1;
              static final int MODEL_SCHEMA_VERSION = 2;
              static final int SCHEMA_VERSION = 3;
              static final String SCOPE_SKETCH_V1 = "sketch-v1";
              static final String SCOPE_MODEL_V2 = "model-v2";
              static final String SCOPE_WORKSPACE_V3 = "workspace-v3";

              static final class Decoded {
                  final int schemaVersion;
                  final String scope;
                  final String unit;
                  final String sketchState;
                  final String modelState;
                  final String referenceImageState;
                  final String workspaceVisualState;

                  Decoded(int schemaVersion, String scope, String unit, String sketchState, String modelState) {
                      this(schemaVersion, scope, unit, sketchState, modelState, null, null);
                  }

                  Decoded(int schemaVersion, String scope, String unit, String sketchState, String modelState, String referenceImageState) {
                      this(schemaVersion, scope, unit, sketchState, modelState, referenceImageState, null);
                  }

                  Decoded(int schemaVersion, String scope, String unit, String sketchState, String modelState,
                          String referenceImageState, String workspaceVisualState) {
                      this.schemaVersion = schemaVersion;
                      this.scope = scope;
                      this.unit = unit;
                      this.sketchState = sketchState;
                      this.modelState = modelState;
                      this.referenceImageState = referenceImageState;
                      this.workspaceVisualState = workspaceVisualState;
                  }

                  boolean hasExactModel(){return modelState!=null;}
                  boolean hasReferenceImage(){return referenceImageState!=null;}
                  boolean hasWorkspaceVisual(){return workspaceVisualState!=null;}
              }

              private CadProjectDocument() {}

              static String encodeSketch(String sketchState) {
                  JSONObject sketch = parseObject(sketchState, "Sketch state is empty", "Invalid sketch project state");
                  try {
                      JSONObject root = new JSONObject();
                      root.put("format", FORMAT);
                      root.put("schemaVersion", SKETCH_SCHEMA_VERSION);
                      root.put("scope", SCOPE_SKETCH_V1);
                      root.put("unit", "mm");
                      root.put("sketch", sketch);
                      return root.toString();
                  } catch (Exception e) {
                      throw new IllegalArgumentException("Invalid sketch project state", e);
                  }
              }

              static String encodeModel(String sketchState,String modelState) {
                  JSONObject sketch=parseObject(sketchState,"Sketch state is empty","Invalid sketch project state");
                  JSONObject model=parseObject(modelState,"Model state is empty","Invalid model project state");
                  try{
                      JSONObject root=new JSONObject();
                      root.put("format",FORMAT);
                      root.put("schemaVersion",MODEL_SCHEMA_VERSION);
                      root.put("scope",SCOPE_MODEL_V2);
                      root.put("unit","mm");
                      root.put("sketch",sketch);
                      root.put("model",model);
                      return root.toString();
                  }catch(Exception e){throw new IllegalArgumentException("Invalid model project state",e);}
              }

              static String encodeWorkspace(String sketchState,String modelState,String referenceImageState) {
                  return encodeWorkspace(sketchState,modelState,referenceImageState,null);
              }

              static String encodeWorkspace(String sketchState,String modelState,String referenceImageState,String workspaceVisualState) {
                  JSONObject sketch=parseObject(sketchState,"Sketch state is empty","Invalid sketch project state");
                  JSONObject model=modelState==null?null:parseObject(modelState,"Model state is empty","Invalid model project state");
                  JSONObject reference=referenceImageState==null?null:parseObject(referenceImageState,"Reference Image state is empty","Invalid Reference Image project state");
                  JSONObject visual=workspaceVisualState==null?null:parseObject(workspaceVisualState,"Visual workspace state is empty","Invalid visual workspace project state");
                  try{
                      JSONObject root=new JSONObject();
                      root.put("format",FORMAT);
                      root.put("schemaVersion",SCHEMA_VERSION);
                      root.put("scope",SCOPE_WORKSPACE_V3);
                      root.put("unit","mm");
                      root.put("sketch",sketch);
                      if(model!=null)root.put("model",model);
                      if(reference!=null)root.put("referenceImage",reference);
                      if(visual!=null)root.put("workspaceVisual",visual);
                      return root.toString();
                  }catch(Exception e){throw new IllegalArgumentException("Invalid workspace project state",e);}
              }

              static Decoded decode(String raw) {
                  if (raw == null || raw.trim().isEmpty()) {
                      throw new IllegalArgumentException("Project file is empty");
                  }
                  try {
                      JSONObject root = new JSONObject(raw);
                      if (!FORMAT.equals(root.optString("format", ""))) {
                          throw new IllegalArgumentException("Unsupported project format");
                      }
                      int version = root.optInt("schemaVersion", -1);
                      if (version < 1) throw new IllegalArgumentException("Missing project schema");
                      if (version > SCHEMA_VERSION) {
                          throw new IllegalArgumentException("Project was created by a newer ChobYar version");
                      }
                      String unit = root.optString("unit", "");
                      if (!"mm".equals(unit)) throw new IllegalArgumentException("Project unit must be mm");
                      JSONObject sketch = root.optJSONObject("sketch");
                      if (sketch == null) throw new IllegalArgumentException("Project sketch section is missing");
                      String scope = root.optString("scope", "");
                      if(version==SKETCH_SCHEMA_VERSION&&SCOPE_SKETCH_V1.equals(scope)){
                          return new Decoded(version,scope,unit,sketch.toString(),null,null,null);
                      }
                      if(version==MODEL_SCHEMA_VERSION&&SCOPE_MODEL_V2.equals(scope)){
                          JSONObject model=root.optJSONObject("model");
                          if(model==null)throw new IllegalArgumentException("Project model section is missing");
                          return new Decoded(version,scope,unit,sketch.toString(),model.toString(),null,null);
                      }
                      if(version==SCHEMA_VERSION&&SCOPE_WORKSPACE_V3.equals(scope)){
                          JSONObject model=root.optJSONObject("model");
                          JSONObject reference=root.optJSONObject("referenceImage");
                          JSONObject visual=root.optJSONObject("workspaceVisual");
                          return new Decoded(version,scope,unit,sketch.toString(),
                                  model==null?null:model.toString(),
                                  reference==null?null:reference.toString(),
                                  visual==null?null:visual.toString());
                      }
                      throw new IllegalArgumentException("Unsupported project scope");
                  } catch (IllegalArgumentException e) {
                      throw e;
                  } catch (Exception e) {
                      throw new IllegalArgumentException("Malformed ChobYar project file", e);
                  }
              }

              private static JSONObject parseObject(String raw,String emptyMessage,String invalidMessage){
                  if(raw==null||raw.trim().isEmpty())throw new IllegalArgumentException(emptyMessage);
                  try{return new JSONObject(raw);}catch(Exception e){throw new IllegalArgumentException(invalidMessage,e);}
              }
          }
          JAVA

          cat > app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java <<'JAVA'
          package ir.chobyar.sketch;

          import android.content.Context;

          import java.lang.reflect.Field;
          import java.util.List;

          /**
           * Transaction boundary used by Save/Open UI.
           *
           * A new file is fully parsed and rebuilt in a scratch CAD workspace before the
           * live document is touched. Exact OCCT state and renderer/workspace visual state
           * are persisted through separate adapters and committed atomically at Open.
           */
          final class CadProjectPersistenceController {
              private CadProjectPersistenceController(){}

              static String encode(Shapr3DGuideCadCanvasView cad){
                  return encode(cad,null,null);
              }

              static String encode(Shapr3DGuideCadCanvasView cad,
                                   CadAppearanceController appearance,
                                   SectionViewController section){
                  if(cad==null)throw new IllegalArgumentException("CAD workspace is missing");
                  if((appearance==null)!=(section==null))throw new IllegalArgumentException("Visual workspace controllers are incomplete");
                  String sketch=cad.exportSketchProjectState();
                  boolean hasBodies=hasAnySolidBody(cad),hasReference=cad.hasReferenceImage();
                  String model=null;
                  if(hasBodies||hasReference){
                      // Reference-only projects still carry exact plane/camera state so the
                      // calibrated image comes back in the same spatial workspace.
                      model=ExactModelProjectAdapter.exportModel(cad);
                      ExactModelProjectAdapter.validateAgainstSketch(model,sketch);
                  }
                  String reference=null;
                  if(hasReference){
                      reference=ReferenceImageProjectAdapter.exportState(cad);
                      ReferenceImageProjectAdapter.validate(reference);
                  }
                  String visual=null;
                  if(appearance!=null){
                      visual=WorkspaceVisualProjectAdapter.exportState(appearance,section);
                      WorkspaceVisualProjectAdapter.validate(visual);
                  }
                  if(hasReference||visual!=null)return CadProjectDocument.encodeWorkspace(sketch,model,reference,visual);
                  if(hasBodies)return CadProjectDocument.encodeModel(sketch,model);
                  return CadProjectDocument.encodeSketch(sketch);
              }

              /**
               * SolidCadCanvasView intentionally keeps its body collection private.  The
               * Save/Open boundary only needs a loss-prevention predicate here: if any Body
               * exists, model-v2 must be used instead of silently writing sketch-v1.  Keep
               * this reflective compatibility shim inside persistence code rather than
               * exposing prototype internals to production UI.
               */
              private static boolean hasAnySolidBody(Shapr3DGuideCadCanvasView cad){
                  try{
                      Field field=SolidCadCanvasView.class.getDeclaredField("bodies");
                      field.setAccessible(true);
                      Object value=field.get(cad);
                      return value instanceof List && !((List<?>)value).isEmpty();
                  }catch(ReflectiveOperationException e){
                      throw new IllegalStateException("Solid model presence could not be inspected",e);
                  }
              }

              static CadProjectDocument.Decoded validate(Shapr3DGuideCadCanvasView cad,String raw){
                  if(cad==null)throw new IllegalArgumentException("CAD workspace is missing");
                  CadProjectDocument.Decoded decoded=CadProjectDocument.decode(raw);
                  if(!cad.canImportSketchProjectState(decoded.sketchState))throw new IllegalArgumentException("Project Sketch is invalid");
                  if(decoded.hasExactModel())ExactModelProjectAdapter.validateAgainstSketch(decoded.modelState,decoded.sketchState);
                  if(decoded.hasReferenceImage())ReferenceImageProjectAdapter.validate(decoded.referenceImageState);
                  if(decoded.hasWorkspaceVisual())WorkspaceVisualProjectAdapter.validate(decoded.workspaceVisualState);
                  return decoded;
              }

              static String restore(Shapr3DGuideCadCanvasView cad,String raw){
                  return restore(cad,null,null,null,raw);
              }

              static String restore(Shapr3DGuideCadCanvasView cad,
                                    CadAppearanceController appearance,
                                    SectionViewController section,
                                    CadAppearanceController.Sink sink,
                                    String raw){
                  if((appearance==null)!=(section==null))throw new IllegalArgumentException("Visual workspace controllers are incomplete");
                  CadProjectDocument.Decoded decoded=validate(cad,raw);
                  String previous=encode(cad,appearance,section); // refuse destructive Open when current state cannot be persisted safely
                  preflight(cad.getContext(),decoded);
                  try{return restoreValidated(cad,appearance,section,sink,decoded);}
                  catch(RuntimeException failure){
                      try{restoreValidated(cad,appearance,section,sink,CadProjectDocument.decode(previous));}catch(Throwable ignored){}
                      throw failure;
                  }
              }

              private static void preflight(Context context,CadProjectDocument.Decoded decoded){
                  Shapr3DGuideCadCanvasView scratch=new Shapr3DGuideCadCanvasView(context);
                  CadAppearanceController scratchAppearance=new CadAppearanceController();
                  SectionViewController scratchSection=new SectionViewController();
                  try{restoreValidated(scratch,scratchAppearance,scratchSection,null,decoded);}
                  finally{scratch.clearAll();}
              }

              private static String restoreValidated(Shapr3DGuideCadCanvasView cad,
                                                     CadAppearanceController appearance,
                                                     SectionViewController section,
                                                     CadAppearanceController.Sink sink,
                                                     CadProjectDocument.Decoded decoded){
                  cad.clearAll();
                  String sketchStatus=cad.importSketchProjectState(decoded.sketchState);
                  String modelStatus=null;
                  if(decoded.hasExactModel())modelStatus=ExactModelProjectAdapter.restoreModel(cad,decoded.modelState,decoded.sketchState);
                  if(decoded.hasReferenceImage())ReferenceImageProjectAdapter.restore(cad,decoded.referenceImageState);
                  if(appearance!=null){
                      if(decoded.hasWorkspaceVisual())WorkspaceVisualProjectAdapter.restore(appearance,section,decoded.workspaceVisualState,sink);
                      else{
                          appearance.restore(CadMaterialPreset.of(CadMaterialPreset.Preset.WOOD),sink);
                          section.restore(false,SectionViewController.Axis.Z,0.0,false);
                      }
                  }
                  String status=sketchStatus;
                  if(modelStatus!=null)status+=" • "+modelStatus;
                  if(decoded.hasReferenceImage())status+=" • Reference Image restored";
                  if(decoded.hasWorkspaceVisual()&&appearance!=null)status+=" • Appearance/Section restored";
                  return status;
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path

          activity=Path('app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java')
          s=activity.read_text()
          old='String json=CadProjectPersistenceController.encode(cad);'
          new='String json=CadProjectPersistenceController.encode(cad,appearance,sectionView);'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Save wiring anchor missing')
          old='String result=CadProjectPersistenceController.restore(cad,raw);'
          new='String result=CadProjectPersistenceController.restore(cad,appearance,sectionView,gpuSurface::setAppearance,raw);'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Open wiring anchor missing')
          activity.write_text(s)

          test=Path('app/src/androidTest/java/ir/chobyar/sketch/WorkspaceVisualProjectStateInstrumentationTest.java')
          s=test.read_text()
          if 'workspaceEnvelopeCarriesVisualStateWithoutExactModel' not in s:
              marker='    private static void assertRejected(String raw) {'
              block='''    @Test\n    public void workspaceEnvelopeCarriesVisualStateWithoutExactModel() {\n        CadAppearanceController appearance = new CadAppearanceController();\n        appearance.restore(new CadMaterialPreset.State(\n                CadMaterialPreset.Preset.PAINT, 0xFF2468AC, 0.41f, 0.07f), null);\n        SectionViewController section = new SectionViewController();\n        section.enable(SectionViewController.Axis.Y);\n        section.setOffsetMm(12.75);\n        section.flip();\n\n        String visual = WorkspaceVisualProjectAdapter.exportState(appearance, section);\n        CadProjectDocument.Decoded decoded = CadProjectDocument.decode(\n                CadProjectDocument.encodeWorkspace("{}", null, null, visual));\n\n        assertTrue(decoded.hasWorkspaceVisual());\n        assertFalse(decoded.hasExactModel());\n        WorkspaceVisualProjectState.Decoded restored = WorkspaceVisualProjectAdapter.validate(decoded.workspaceVisualState);\n        assertEquals(CadMaterialPreset.Preset.PAINT, restored.appearance.preset);\n        assertEquals(0xFF2468AC, restored.appearance.argb);\n        assertEquals(0.41f, restored.appearance.roughness, 0.0001f);\n        assertEquals(SectionViewController.Axis.Y, restored.sectionAxis);\n        assertEquals(12.75, restored.sectionOffsetMm, 0.000001);\n        assertTrue(restored.sectionFlipped);\n    }\n\n    @Test\n    public void earlierWorkspaceV3WithoutVisualStateRemainsReadable() {\n        CadProjectDocument.Decoded decoded = CadProjectDocument.decode(\n                CadProjectDocument.encodeWorkspace("{}", null, null));\n        assertEquals(CadProjectDocument.SCOPE_WORKSPACE_V3, decoded.scope);\n        assertFalse(decoded.hasWorkspaceVisual());\n    }\n\n'''
              if marker not in s: raise SystemExit('visual test insertion anchor missing')
              s=s.replace(marker,block+marker,1)
              test.write_text(s)

          visual=Path('.github/workflows/workspace-visual-persistence.yml')
          s=visual.read_text()
          for path in [
              "      - 'app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java'\n",
              "      - 'app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java'\n",
              "      - 'app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java'\n",
          ]:
              if path not in s:
                  anchor="      - 'app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java'\n"
                  s=s.replace(anchor,anchor+path,1)
          checks='''          grep -q 'workspaceVisual' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java\n          grep -q 'WorkspaceVisualProjectAdapter.exportState' app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java\n          grep -q 'CadProjectPersistenceController.encode(cad,appearance,sectionView)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java\n          grep -q 'CadProjectPersistenceController.restore(cad,appearance,sectionView,gpuSurface::setAppearance,raw)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java\n'''
          anchor="          grep -q 'void restore(boolean nextEnabled' app/src/main/java/ir/chobyar/sketch/SectionViewController.java\n"
          if 'WorkspaceVisualProjectAdapter.exportState' not in s:
              s=s.replace(anchor,anchor+checks,1)
          s=s.replace("grep -q 'OK (7 tests)' test-artifacts/workspace-visual-persistence.txt","grep -q 'OK (9 tests)' test-artifacts/workspace-visual-persistence.txt")
          visual.write_text(s)

          project=Path('.github/workflows/project-persistence-contract.yml')
          s=project.read_text()
          extra_paths=[
              "      - 'app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectState.java'\n",
              "      - 'app/src/main/java/ir/chobyar/sketch/WorkspaceVisualProjectAdapter.java'\n",
              "      - 'app/src/main/java/ir/chobyar/sketch/CadAppearanceController.java'\n",
              "      - 'app/src/main/java/ir/chobyar/sketch/SectionViewController.java'\n",
              "      - 'app/src/androidTest/java/ir/chobyar/sketch/WorkspaceVisualProjectStateInstrumentationTest.java'\n",
          ]
          anchor="      - 'app/src/main/java/ir/chobyar/sketch/ReferenceImageProjectAdapter.java'\n"
          for p in extra_paths:
              if p not in s: s=s.replace(anchor,anchor+p,1)
          s=s.replace("grep -q 'CadProjectPersistenceController.encode(cad)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java",
                      "grep -q 'CadProjectPersistenceController.encode(cad,appearance,sectionView)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java")
          s=s.replace("grep -q 'CadProjectPersistenceController.restore(cad,raw)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java",
                      "grep -q 'CadProjectPersistenceController.restore(cad,appearance,sectionView,gpuSurface::setAppearance,raw)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java")
          if "WorkspaceVisualProjectAdapter.exportState" not in s:
              anchor="          ! grep -q 'getDeclaredField' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java\n"
              s=s.replace(anchor,"          grep -q 'workspaceVisual' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java\n          grep -q 'WorkspaceVisualProjectAdapter.exportState' app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java\n"+anchor,1)
          if 'project-persistence-visual.txt' not in s:
              anchor="            grep -q 'OK (5 tests)' test-artifacts/project-persistence-reference-image.txt\n"
              extra="            adb shell am instrument -w -e class ir.chobyar.sketch.WorkspaceVisualProjectStateInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/project-persistence-visual.txt\n            grep -q 'OK (9 tests)' test-artifacts/project-persistence-visual.txt\n"
              s=s.replace(anchor,anchor+extra,1)
          project.write_text(s)
          PY
      - name: Commit production integration
        run: |
          set -euo pipefail
          git add app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java \
                  app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java \
                  app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java \
                  app/src/androidTest/java/ir/chobyar/sketch/WorkspaceVisualProjectStateInstrumentationTest.java \
                  .github/workflows/workspace-visual-persistence.yml \
                  .github/workflows/project-persistence-contract.yml
          if git diff --cached --quiet; then
            echo 'Production integration already present.'
            exit 0
          fi
          git commit -m 'Persist appearance and section state through production Save/Open'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
