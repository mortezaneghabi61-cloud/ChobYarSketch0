name: ChobYar Trader v5 Manual Live Arm Stage 15

on:
  pull_request:
    paths:
      - 'ops/chobyar-trader/v5/execution_safety/manual_live_arm.py'
      - 'ops/chobyar-trader/v5/execution_safety/test_manual_live_arm.py'
      - '.github/workflows/chobyar-trader-v5-manual-live-arm-stage15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-live-arm:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      V5: ops/chobyar-trader/v5/execution_safety
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact-head lock
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Frozen v4 remains untouched
        run: test "$(git rev-parse HEAD:ops/chobyar-trader/v4)" = 'b4b7cddde55cf683b42a31b24bd598ce2c78abb2'

      - name: Compile Stage-15
        run: python3 -m py_compile "$V5/manual_live_arm.py" "$V5/test_manual_live_arm.py"

      - name: Deterministic Stage-15 tests
        env:
          PYTHONPATH: ops/chobyar-trader/v5/execution_safety
        run: python3 "$V5/test_manual_live_arm.py" -v

      - name: Non-executing arm boundary
        run: |
          set -Eeuo pipefail
          grep -q 'ready_to_change_live_env=False' "$V5/manual_live_arm.py"
          grep -q 'live_ready=False' "$V5/manual_live_arm.py"
          grep -q 'execution_authority=False' "$V5/manual_live_arm.py"
          grep -q 'trade_permission_must_still_be_off_before_manual_arm' "$V5/manual_live_arm.py"
          grep -q 'withdrawal_permission_must_remain_off' "$V5/manual_live_arm.py"
          if grep -RniE '\.(post|put|patch|delete)\(|/v1/account/orders|submit_order|create_order|place_order|cancel_order|withdraw\(' \
            "$V5/manual_live_arm.py" "$V5/test_manual_live_arm.py"; then
            echo 'Forbidden mutable exchange surface in Stage-15' >&2
            exit 1
          fi

      - name: Explicit operator boundary
        run: |
          grep -q 'explicit_manual_live_arm_confirmation_required' "$V5/manual_live_arm.py"
          grep -q 'ready_to_request_manual_trade_permission=True' "$V5/manual_live_arm.py"
