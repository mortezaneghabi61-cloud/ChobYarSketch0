name: Section View Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/ir/chobyar/sketch/SectionViewController.java'
      - 'app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/SectionViewControllerInstrumentationTest.java'
      - '.github/workflows/section-view-contract.yml'

permissions:
  contents: read

concurrency:
  group: section-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  section-view:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 38${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.section.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate renderer-only section wiring
        run: |
          set -euo pipefail
          grep -q 'final class SectionViewController' app/src/main/java/ir/chobyar/sketch/SectionViewController.java
          grep -q 'double\[\] apply(double\[\] xyz)' app/src/main/java/ir/chobyar/sketch/SectionViewController.java
          grep -q 'sectionView.apply(mesh)' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -q 'showSectionViewPanel' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run section view contracts on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.SectionViewControllerInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/section-view.txt
            grep -q 'OK (4 tests)' test-artifacts/section-view.txt
      - name: Upload section evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-section-view-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
