name: K3.8 Smart Handle Routing Fix

on:
  push:
    branches: [k3-8-point-lock-interaction-ready]
    paths:
      - .github/workflows/k38-smart-handle-routing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify one-shot parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c6fb974565b1ff23f80f8f1e1521b9f1d42efb1b"
      - name: Apply selected-handle routing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ir/chobyar/sketch/SmartCadCanvasView.java')
          s = p.read_text()

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          s = once(s,
              '''        if (action == MotionEvent.ACTION_DOWN) {\n            boxStartX = boxEndX = event.getX();\n            boxStartY = boxEndY = event.getY();\n            Object hit = coreFindHit(wx, wy);\n''',
              '''        if (action == MotionEvent.ACTION_DOWN) {\n            boxStartX = boxEndX = event.getX();\n            boxStartY = boxEndY = event.getY();\n\n            // Selected control handles outrank body-hit. In particular, an Arc\n            // center is intentionally off-curve and must not become empty-space\n            // selection before the model-authority point gesture can finish.\n            if (selectedControlHandleHit(wx, wy)) {\n                selectionBoxCandidate = false;\n                selectionBoxActive = false;\n                pendingTapHit = null;\n                boolean handled = super.onTouchEvent(event);\n                syncSelectionFromBase();\n                return handled;\n            }\n\n            Object hit = coreFindHit(wx, wy);\n''',
              'normal-select handle priority')

          s = once(s,
              '''    private Object baseSelected() { return selected; }\n\n    private void setBaseSelected(Object value) {\n''',
              '''    private Object baseSelected() { return selected; }\n\n    private boolean selectedControlHandleHit(float wx, float wy) {\n        Object current = baseSelected();\n        if (!(current instanceof Entity)) return false;\n        float radius = 18f / (PX_PER_MM * Math.max(.02f, viewScale()));\n        float radius2 = radius * radius;\n        List<ControlPoint> points = ((Entity) current).controlPoints();\n        if (points == null) return false;\n        for (ControlPoint point : points) {\n            if (point == null) continue;\n            float dx = wx - point.x;\n            float dy = wy - point.y;\n            if (dx * dx + dy * dy <= radius2) return true;\n        }\n        return false;\n    }\n\n    private void setBaseSelected(Object value) {\n''',
              'selected handle helper')

          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/k38-smart-handle-routing-fix.yml
          git add app/src/main/java/ir/chobyar/sketch/SmartCadCanvasView.java
          git diff --cached --check
          git config user.name "chobyar-k38-routing"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "K3.8 interaction: prioritize selected control handles before body hit"
          git push origin HEAD:k3-8-point-lock-interaction-ready
