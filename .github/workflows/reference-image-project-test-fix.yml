name: Reference Image persistence test fix

on:
  push:
    branches:
      - feature/reference-image-persistence-20260821

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reference-image-persistence-20260821
          fetch-depth: 0
      - name: Correct exact pixel coordinate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/ir/chobyar/sketch/ReferenceImageProjectPersistenceInstrumentationTest.java')
          s=p.read_text()
          old='assertEquals(Color.CYAN,bitmap.getPixel(1,1))'
          new='assertEquals(Color.CYAN,bitmap.getPixel(2,1))'
          if old not in s: raise SystemExit('pixel assertion anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fix and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/reference-image-project-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/androidTest/java/ir/chobyar/sketch/ReferenceImageProjectPersistenceInstrumentationTest.java
          git commit -m 'Fix Reference Image pixel round-trip assertion'
          git push origin HEAD:feature/reference-image-persistence-20260821
