name: ChobYar Trader V6.8 Profit Protection Shadow

on:
  pull_request:
    paths:
      - 'ops/chobyar-trader/v6/profit_protection_shadow.py'
      - 'ops/chobyar-trader/v6/test_profit_protection_shadow.py'
      - 'ops/chobyar-trader/v6/install-profit-protection-shadow.sh'
      - '.github/workflows/chobyar-trader-v68-profit-protection-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'ops/chobyar-trader/v6/profit_protection_shadow.py'
      - 'ops/chobyar-trader/v6/test_profit_protection_shadow.py'
      - 'ops/chobyar-trader/v6/install-profit-protection-shadow.sh'
      - '.github/workflows/chobyar-trader-v68-profit-protection-shadow.yml'

permissions:
  contents: read

jobs:
  profit-protection-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Deterministic shadow contracts
        run: |
          set -Eeuo pipefail
          source_dir='ops/chobyar-trader/v6'
          python3 -m py_compile "$source_dir/profit_protection_shadow.py"
          PYTHONPATH="$source_dir" python3 -m unittest -v "$source_dir/test_profit_protection_shadow.py"
      - name: Enforce public GET-only observation authority
        run: |
          set -Eeuo pipefail
          file='ops/chobyar-trader/v6/profit_protection_shadow.py'
          if grep -niE '\.(post|put|patch|delete)\(|submit_order|create_order|place_order|cancel_order|withdraw|api[_-]?key|authorization|LIVE_TRADING_ENABLED=true|systemctl|subprocess' "$file"; then
            echo 'Mutable, authenticated, live, process, or execution surface detected' >&2
            exit 1
          fi
          grep -q 'client.get("/v1/depth"' "$file"
          grep -q 'execution_authority: bool = False' "$file"
          grep -q 'automatic_promotion: bool = False' "$file"
      - name: Verify isolated installer contract
        run: |
          set -Eeuo pipefail
          installer='ops/chobyar-trader/v6/install-profit-protection-shadow.sh'
          bash -n "$installer"
          grep -q 'exact 40-character commit SHA required' "$installer"
          grep -q 'TRADER_PID_UNCHANGED' "$installer"
          grep -q 'rollback; cleanup' "$installer"
          grep -q "unittest discover -v -s.*-p 'test_profit_protection_shadow.py'" "$installer"
          if grep -nE 'unittest -v .*test_profit_protection_shadow\.py' "$installer"; then
            echo 'Absolute-path unittest invocation detected' >&2
            exit 1
          fi
          if grep -nE 'systemctl (restart|stop|disable).*chobyar-trader\.service|sed -i.*\.env|rm -f.*\.env' "$installer"; then
            echo 'Installer may mutate the active trader or environment' >&2
            exit 1
          fi
