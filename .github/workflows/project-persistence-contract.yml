name: Project Persistence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java'
      - 'app/src/main/java/ir/chobyar/sketch/ExactModelProjectState.java'
      - 'app/src/main/java/ir/chobyar/sketch/ExactModelProjectAdapter.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/ProjectPersistenceInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/ExactModelProjectStateInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/ExactModelProjectAdapterInstrumentationTest.java'
      - '.github/workflows/project-persistence-contract.yml'

permissions:
  contents: read

concurrency:
  group: project-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 39${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.project.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit Save/Open project boundary
        run: |
          set -euo pipefail
          grep -q 'FORMAT = "chobyar-project"' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java
          grep -q 'SCOPE_SKETCH_V1 = "sketch-v1"' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java
          grep -q 'SCOPE_MODEL_V2 = "model-v2"' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java
          grep -q 'static String encodeModel' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java
          grep -q 'Transient OCCT/display state cannot be persisted' app/src/main/java/ir/chobyar/sketch/ExactModelProjectState.java
          grep -q 'static String exportModel' app/src/main/java/ir/chobyar/sketch/ExactModelProjectAdapter.java
          grep -q 'validateAgainstSketch' app/src/main/java/ir/chobyar/sketch/ExactModelProjectAdapter.java
          grep -q 'public String exportSketchProjectState()' app/src/main/java/ir/chobyar/sketch/CadCanvasView.java
          grep -q 'public boolean canImportSketchProjectState' app/src/main/java/ir/chobyar/sketch/CadCanvasView.java
          grep -q 'REQUEST_SAVE_PROJECT=1703' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -q 'REQUEST_OPEN_PROJECT=1704' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -q 'ذخیره پروژه 3D هنوز کامل نشده' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          ! grep -q 'getDeclaredField' app/src/main/java/ir/chobyar/sketch/CadProjectDocument.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run project persistence contracts on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.ProjectPersistenceInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/project-persistence-v1.txt
            grep -q 'OK (6 tests)' test-artifacts/project-persistence-v1.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.ExactModelProjectStateInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/project-persistence-v2.txt
            grep -q 'OK (7 tests)' test-artifacts/project-persistence-v2.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.ExactModelProjectAdapterInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/project-persistence-adapter.txt
            grep -q 'OK (3 tests)' test-artifacts/project-persistence-adapter.txt
      - name: Upload project persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-project-persistence-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7