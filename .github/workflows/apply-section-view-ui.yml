name: Apply Section View UI Patch

on:
  push:
    branches:
      - feature/section-view-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-section-view:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/section-view-20260821
      - name: Apply production workspace patch
        run: python .github/scripts/apply-section-view-ui.py
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          git commit -m "Wire Section View into production workspace"
          git push origin HEAD:feature/section-view-20260821
