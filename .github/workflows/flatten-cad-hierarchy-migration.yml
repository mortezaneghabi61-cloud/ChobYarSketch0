name: Flatten CAD Hierarchy Migration

on:
  push:
    branches:
      - p0-flatten-production-cad-surface-20260909

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ !contains(github.event.head_commit.message, '[flatten-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: p0-flatten-production-cad-surface-20260909

      - name: Verify exact branch head
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git branch --show-current)" = "p0-flatten-production-cad-surface-20260909"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode and repair flattening transformer fail-closed
        run: |
          python - <<'PY'
          import base64, pathlib, re
          src = pathlib.Path('.github/scripts/FlattenCadHierarchy.java.b64')
          text = src.read_text(encoding='utf-8')
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', text)
          clean = clean.rstrip('=')
          clean += '=' * ((4 - (len(clean) % 4)) % 4)
          raw = base64.b64decode(clean, validate=False)
          code = raw.decode('utf-8', errors='replace')

          # Repair the few bytes damaged while the one-shot transformer was transported.
          code = code.replace('e=>ownerIndex(e)', 'e -> ownerIndex(e)')
          code = code.replace('if(e==null){return;}', 'if(e==null){return null;}')
          code = code.replace(
              'child.getEnclosingElement().getSuperclass()',
              '((TypeElement) child.getEnclosingElement()).getSuperclass()',
          )

          literal_method = '''    private void replaceStringLiteral(UnitInfo u, LiteralTree lit, String value, int pri) {
              long s = sp.getStartPosition(u.cu, lit), e = sp.getEndPosition(u.cu, lit);
              if (s >= 0 && e >= s) {
                  String q = Character.toString(34);
                  String bs = Character.toString(92);
                  String escaped = value.replace(bs, bs + bs).replace(q, bs + q);
                  u.edits.add(new Edit(s, e, q + escaped + q, pri));
              }
          }'''
          code, n1 = re.subn(
              r'(?m)^\s*private void replaceStringLiteral\([^\n]*$',
              lambda _m: literal_method,
              code,
              count=1,
          )

          delete_method = '''    private void deleteLegacyLayerFiles() throws Exception {
              for (String n : CHAIN) {
                  if (!n.equals(TARGET)) {
                      Files.deleteIfExists(repo.resolve("app/src/main/java/ir/chobyar/sketch/" + n + ".java"));
                  }
              }
          }'''
          code, n2 = re.subn(
              r'(?m)^\s*private void deleteLegacyLayerFiles\(\) throws Exception \{[^\n]*$',
              lambda _m: delete_method,
              code,
              count=1,
          )

          # One method was duplicated by the damaged transport. Keep the first exact method body.
          signature = 'private void addClassForNameStringEdits(UnitInfo u)'
          starts = [m.start() for m in re.finditer(re.escape(signature), code)]
          if len(starts) == 2:
              start = code.rfind('\n', 0, starts[1]) + 1
              brace = code.find('{', starts[1])
              if brace < 0:
                  raise SystemExit('duplicate method opening brace missing')
              depth = 0
              end = None
              for i in range(brace, len(code)):
                  ch = code[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('duplicate method closing brace missing')
              while end < len(code) and code[end] in ' \t\r\n':
                  end += 1
              code = code[:start] + code[end:]
          elif len(starts) != 1:
              raise SystemExit(f'unexpected addClassForNameStringEdits count={len(starts)}')

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'expected exact transformer repairs n1={n1} n2={n2}')

          out = pathlib.Path('/tmp/FlattenCadHierarchy.java')
          out.write_text(code, encoding='utf-8')
          print(f'encoded_chars={len(text)} filtered_chars={len(clean)} decoded_bytes={len(raw)} repaired_chars={len(code)}')
          if len(code) < 10000:
              raise SystemExit('flatten transformer unexpectedly short')
          if 'public final class FlattenCadHierarchy' not in code:
              raise SystemExit('flatten transformer signature missing')
          PY

      - name: Compile transformer
        run: |
          rm -rf /tmp/flatten-classes
          mkdir -p /tmp/flatten-classes
          javac -encoding UTF-8 -d /tmp/flatten-classes /tmp/FlattenCadHierarchy.java

      - name: Flatten production CAD hierarchy
        run: |
          java -cp /tmp/flatten-classes FlattenCadHierarchy "$GITHUB_WORKSPACE"

      - name: Verify legacy production hierarchy is gone
        run: |
          test -f app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java
          grep -Eq 'class[[:space:]]+K33MirroredCadCanvasView[[:space:]]+extends[[:space:]]+View' app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java
          for f in \
            CadCanvasView SmartCadCanvasView AdvancedCadCanvasView CentimeterCadCanvasView \
            ShaprStyleCadCanvasView ChobYarShaprCanvasView ParametricSketchCanvasView \
            ShaprLabCanvasView EasyCadCanvasView SpatialCadCanvasView SolidCadCanvasView \
            DualUnitSolidCadCanvasView ParametricHistorySolidCadCanvasView \
            AdvancedParametricSolidCadCanvasView DirectModelCadCanvasView \
            BRepDirectCadCanvasView AnalyticCadCanvasView AnalyticBooleanCadCanvasView \
            ExactBooleanCadCanvasView NativeBRepCadCanvasView OcctModelCadCanvasView \
            OcctDirectCadCanvasView OcctStableCadCanvasView OcctMeasureCadCanvasView \
            OcctShaprCadCanvasView OcctShaprPenCadCanvasView ShaprSketchStateCadCanvasView \
            ShaprConstraintSolverCadCanvasView ShaprParametricCurveCadCanvasView \
            ShaprSplineEditingCadCanvasView ShaprArcCadCanvasView ShaprSnappingCadCanvasView \
            Shapr3DGuideCadCanvasView; do
              test ! -e "app/src/main/java/ir/chobyar/sketch/${f}.java" || {
                echo "Legacy production file remains: ${f}.java" >&2
                exit 1
              }
          done
          git diff --check

      - name: Commit generated canonical production surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes produced" >&2
            exit 1
          fi
          git commit -m "P0: flatten legacy CAD production hierarchy [flatten-generated]"
          git push origin HEAD:p0-flatten-production-cad-surface-20260909
