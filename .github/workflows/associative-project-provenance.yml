name: Associative Project Provenance Contract

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820
    paths:
      - '.github/scripts/apply-associative-project-provenance.py'
      - '.github/workflows/associative-project-provenance.yml'
      - 'app/src/androidTest/java/ir/chobyar/sketch/AssociativeProjectProvenanceInstrumentationTest.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/OcctModelCadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CHOBYAR_VERSION_CODE: 41${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.project3d.assoc.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sketch-core-type-safe-20260820
          fetch-depth: 0

      - name: Apply typed associative Project patch
        id: patch
        continue-on-error: true
        run: python3 .github/scripts/apply-associative-project-provenance.py

      - uses: actions/setup-java@v5
        if: steps.patch.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: steps.patch.outcome == 'success'

      - name: Install Android 35 toolchain
        if: steps.patch.outcome == 'success'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.patch.outcome == 'success'
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        if: steps.patch.outcome == 'success'
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build production and all instrumentation APKs
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee test-artifacts/assoc-build.log

      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run associative + Project regression contracts on API 35
        id: contracts
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.AssociativeProjectProvenanceInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/assoc-project.txt
            grep -q 'OK (4 tests)' test-artifacts/assoc-project.txt
            adb logcat -d -v brief | grep 'AssocProject.*ASSOC_.*_RESULT' | sed -E 's/^.*(ASSOC_[A-Z_]+_RESULT)/\1/' | tee test-artifacts/assoc-results.txt
            grep -q '^ASSOC_UNDO_REDO_RESULT created=1 undo=0 refresh=0 redo=1 body=7 edge=9$' test-artifacts/assoc-results.txt
            grep -q '^ASSOC_DELETE_RESULT updated=25 sameObject=true delete=0 refresh=0 undoDelete=1$' test-artifacts/assoc-results.txt
            grep -q '^ASSOC_GUARD_RESULT edgeMissing=1 typeMismatch=1 bodyMissing=1 preserved=true$' test-artifacts/assoc-results.txt
            grep -q '^ASSOC_MULTI_RESULT refs=3 updated=3 line=18 circleD=18 arcD=24 body=11$' test-artifacts/assoc-results.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.Project3DSelectedBodyInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/selected-regression.txt
            grep -q 'OK (3 tests)' test-artifacts/selected-regression.txt

            adb logcat -c
            adb shell am instrument -w -e class ir.chobyar.sketch.Project3DExactInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/exact-regression.txt
            grep -q 'OK (3 tests)' test-artifacts/exact-regression.txt

      - name: Persist verified production source or restore branch safety
        if: always()
        shell: bash
        run: |
          set -eu
          VERIFIED=false
          if [ '${{ steps.patch.outcome }}' = 'success' ] && [ '${{ steps.build.outcome }}' = 'success' ] && [ '${{ steps.contracts.outcome }}' = 'success' ]; then VERIFIED=true; fi
          if [ "$VERIFIED" != true ]; then
            git restore -- app/src/main/java/ir/chobyar/sketch/CadCanvasView.java app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java app/src/main/java/ir/chobyar/sketch/OcctModelCadCanvasView.java app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java || true
            git rm -f app/src/androidTest/java/ir/chobyar/sketch/AssociativeProjectProvenanceInstrumentationTest.java || true
          fi
          mkdir -p docs
          cat > docs/associative-project-provenance-status.txt <<EOF
          source_sha=${{ github.sha }}
          workflow_run=${{ github.run_id }}
          patch=${{ steps.patch.outcome }}
          build=${{ steps.build.outcome }}
          contracts=${{ steps.contracts.outcome }}
          verified=$VERIFIED
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$VERIFIED" = true ]; then
            git add app/src/main/java/ir/chobyar/sketch/CadCanvasView.java app/src/main/java/ir/chobyar/sketch/SpatialCadCanvasView.java app/src/main/java/ir/chobyar/sketch/OcctModelCadCanvasView.java app/src/main/java/ir/chobyar/sketch/Shapr3DGuideCadCanvasView.java app/src/androidTest/java/ir/chobyar/sketch/AssociativeProjectProvenanceInstrumentationTest.java docs/associative-project-provenance-status.txt
            git commit -m 'Persist associative Project provenance [skip ci]' || true
          else
            git add -A docs/associative-project-provenance-status.txt app/src/androidTest/java/ir/chobyar/sketch/AssociativeProjectProvenanceInstrumentationTest.java
            git commit -m 'Restore branch after associative Project validation failure [skip ci]' || true
          fi
          git fetch origin refactor/sketch-core-type-safe-20260820
          git rebase origin/refactor/sketch-core-type-safe-20260820
          git push origin HEAD:refactor/sketch-core-type-safe-20260820

      - name: Upload associative Project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-associative-project-provenance-evidence
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce associative Project contract
        if: always()
        run: |
          test '${{ steps.patch.outcome }}' = 'success'
          test '${{ steps.build.outcome }}' = 'success'
          test '${{ steps.contracts.outcome }}' = 'success'
