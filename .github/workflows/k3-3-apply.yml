name: K3.3 One-shot Production Wiring

on:
  push:
    branches:
      - k3-3-sketch-document-mirror

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'K3.3: wire production mirror') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-3-sketch-document-mirror
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire production canvas
        run: python tools/k33_wire_production.py
      - name: Verify patch shape
        run: |
          grep -q 'private K33MirroredCadCanvasView cad;' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          grep -q 'cad=new K33MirroredCadCanvasView(this);' app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          git diff --check
      - name: Compile and unit-test K3.3
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified wiring and remove one-shot machinery
        run: |
          git config user.name 'chobyar-supervisor'
          git config user.email 'chobyar-supervisor@users.noreply.github.com'
          git rm tools/k33_wire_production.py .github/workflows/k3-3-apply.yml
          git add app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java
          git commit -m 'K3.3: wire production mirror after compile verification'
          git push origin HEAD:k3-3-sketch-document-mirror
