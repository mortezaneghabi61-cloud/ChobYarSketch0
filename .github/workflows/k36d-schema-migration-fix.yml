name: K3.6d persistence schema migration repair

on:
  push:
    branches: [k3-6d-coincident-point-authority]
    paths:
      - '.github/workflows/k36d-schema-migration-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6d-coincident-point-authority
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bump directed constraint schema and migrate v1 Coincident ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          k33 = Path('app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java')
          s = k33.read_text()
          old = '            root.put("modelConstraintSchemaVersion",1);\n'
          new = '            root.put("modelConstraintSchemaVersion",2);\n'
          if old not in s:
              raise SystemExit('K33 schema writer anchor missing')
          k33.write_text(s.replace(old, new, 1))

          bridge = Path('app/src/main/java/ir/chobyar/sketch/core/LegacySketchStateBridge.java')
          s = bridge.read_text()
          old = '''            ArrayList<SketchConstraint> constraints = new ArrayList<>();\n            LinkedHashSet<String> constraintIds = new LinkedHashSet<>();\n            JSONArray constraintRows = root.optJSONArray("modelConstraints");\n'''
          new = '''            int modelConstraintSchema = root.optInt("modelConstraintSchemaVersion", 1);\n            if (modelConstraintSchema < 1 || modelConstraintSchema > 2) {\n                throw new IllegalArgumentException("Unsupported model constraint schema: " + modelConstraintSchema);\n            }\n\n            ArrayList<SketchConstraint> constraints = new ArrayList<>();\n            LinkedHashSet<String> constraintIds = new LinkedHashSet<>();\n            JSONArray constraintRows = root.optJSONArray("modelConstraints");\n'''
          if old not in s:
              raise SystemExit('Legacy bridge schema anchor missing')
          s = s.replace(old, new, 1)
          old = '''                    boolean driving = row.optBoolean("driving", true);\n                    constraints.add(new SketchConstraint(id, kind, primary, primaryPoint,\n                            secondary, secondaryPoint, value, driving));\n'''
          new = '''                    boolean driving = row.optBoolean("driving", true);\n                    // Schema v1 pre-dates K3.6d directed COINCIDENT semantics.\n                    // The old solver treated primary as the target and secondary\n                    // as the moved endpoint. Normalize persisted v1 data into the\n                    // v2 contract: primary=driven, secondary=target.\n                    if (modelConstraintSchema == 1 && kind == SketchConstraint.Kind.COINCIDENT) {\n                        String oldPrimary = primary;\n                        int oldPrimaryPoint = primaryPoint;\n                        primary = secondary;\n                        primaryPoint = secondaryPoint;\n                        secondary = oldPrimary;\n                        secondaryPoint = oldPrimaryPoint;\n                    }\n                    constraints.add(new SketchConstraint(id, kind, primary, primaryPoint,\n                            secondary, secondaryPoint, value, driving));\n'''
          if old not in s:
              raise SystemExit('Legacy bridge constraint anchor missing')
          bridge.write_text(s.replace(old, new, 1))

          test = Path('app/src/test/java/ir/chobyar/sketch/core/K36dConstraintSchemaMigrationTest.java')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''package ir.chobyar.sketch.core;

import org.junit.Test;

import static org.junit.Assert.assertEquals;

public class K36dConstraintSchemaMigrationTest {
    @Test public void schemaV1CoincidentOrderingMigratesToDirectedV2Contract() {
        String raw = "{" +
                "\"schemaVersion\":2," +
                "\"modelConstraintSchemaVersion\":1," +
                "\"entities\":[" +
                "{\"id\":\"target\",\"type\":\"LINE\",\"x1\":0,\"y1\":0,\"x2\":10,\"y2\":0}," +
                "{\"id\":\"driven\",\"type\":\"LINE\",\"x1\":20,\"y1\":0,\"x2\":30,\"y2\":0}]," +
                "\"modelConstraints\":[{" +
                "\"id\":\"c1\",\"kind\":\"COINCIDENT\"," +
                "\"primaryEntityId\":\"target\",\"primaryPointIndex\":1," +
                "\"secondaryEntityId\":\"driven\",\"secondaryPointIndex\":0," +
                "\"driving\":true}]}";

        LegacySketchStateBridge.Result parsed = LegacySketchStateBridge.parse(raw);
        SketchConstraint c = parsed.constraints.get(0);
        assertEquals("driven", c.primaryEntityId);
        assertEquals(0, c.primaryPointIndex);
        assertEquals("target", c.secondaryEntityId);
        assertEquals(1, c.secondaryPointIndex);
    }

    @Test(expected = IllegalArgumentException.class)
    public void futureConstraintSchemaFailsClosed() {
        LegacySketchStateBridge.parse("{\"schemaVersion\":2,\"modelConstraintSchemaVersion\":99,\"entities\":[]}");
    }
}
''')
          PY
      - name: Verify JVM, production and instrumentation compilation
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Commit verified schema fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name chobyar-supervisor
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/k36d-schema-migration-fix.yml
          git add app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java app/src/main/java/ir/chobyar/sketch/core/LegacySketchStateBridge.java app/src/test/java/ir/chobyar/sketch/core/K36dConstraintSchemaMigrationTest.java
          git commit -m 'K3.6d: version directed endpoint constraint persistence'
          git pull --rebase origin k3-6d-coincident-point-authority
          git push origin HEAD:k3-6d-coincident-point-authority
