name: ChobYar Trader v5 Live Activation Stage 19

on:
  pull_request:
    branches:
      - automation/chobyar-trader-v55-paper-entry-gate
    paths:
      - 'ops/chobyar-trader/v5/execution_safety/**'
      - '.github/workflows/chobyar-trader-v5-live-activation-stage19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage19-live-activation-boundary:
    runs-on: ubuntu-24.04
    env:
      V5: ops/chobyar-trader/v5/execution_safety
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "STAGE19_EXACT_HEAD expected=${expected} actual=${actual}"
          test "$actual" = "$expected"

      - name: Compile and test Stage 19 boundary
        shell: bash
        env:
          PYTHONPATH: ops/chobyar-trader/v5/execution_safety
        run: |
          set -euo pipefail
          python3 -m py_compile "$V5/live_activation_stage19.py" "$V5/test_live_activation_stage19.py"
          python3 "$V5/test_live_activation_stage19.py" -v

      - name: Enforce non-executing boundary
        shell: bash
        run: |
          set -euo pipefail
          files="$V5/live_activation_stage19.py $V5/test_live_activation_stage19.py"
          if grep -nEiq '(/v1/account/orders|\.post\(|\.put\(|\.patch\(|\.delete\(|requests\.(post|put|patch|delete)|httpx\.(post|put|patch|delete))' $files; then
            echo 'Forbidden mutable exchange surface detected in Stage-19' >&2
            exit 1
          fi
          grep -q 'live_ready=False' "$V5/live_activation_stage19.py"
          grep -q 'execution_authority=False' "$V5/live_activation_stage19.py"
          grep -q 'order_submission_authority=False' "$V5/live_activation_stage19.py"
          grep -q 'current_runtime_must_still_be_paper' "$V5/live_activation_stage19.py"
          grep -q 'current_live_gate_must_still_be_false' "$V5/live_activation_stage19.py"
          grep -q 'approved_live_cap_must_equal_10_usdt' "$V5/live_activation_stage19.py"
          grep -q 'withdrawal_permission_must_remain_off' "$V5/live_activation_stage19.py"
          grep -q 'open_orders_must_be_zero_before_transition' "$V5/live_activation_stage19.py"

      - name: Verify production runtime remains paper-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MODE != "paper" or LIVE != "false"' "$V5/trader.py"
          if grep -Eq '/v1/account/orders|\.post\(' "$V5/trader.py"; then
            echo 'Unexpected order submission surface found in production runtime' >&2
            exit 1
          fi
