name: K3.6d directed persistence schema repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/k36d-schema-pr-fix.yml'
      - 'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java'
      - 'app/src/main/java/ir/chobyar/sketch/core/LegacySketchStateBridge.java'
      - 'app/src/test/java/ir/chobyar/sketch/core/K36dConstraintSchemaMigrationTest.java'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'k3-6d-coincident-point-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-6d-coincident-point-authority
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Version directed endpoint constraints and migrate legacy ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          k33=Path('app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java')
          s=k33.read_text()
          if 'root.put("modelConstraintSchemaVersion",1);' in s:
              s=s.replace('root.put("modelConstraintSchemaVersion",1);','root.put("modelConstraintSchemaVersion",2);',1)
          elif 'root.put("modelConstraintSchemaVersion",2);' not in s:
              raise SystemExit('model constraint schema writer missing')
          k33.write_text(s)

          bridge=Path('app/src/main/java/ir/chobyar/sketch/core/LegacySketchStateBridge.java')
          s=bridge.read_text()
          if 'int modelConstraintSchema = root.optInt("modelConstraintSchemaVersion", 1);' not in s:
              anchor='''            ArrayList<SketchConstraint> constraints = new ArrayList<>();\n            LinkedHashSet<String> constraintIds = new LinkedHashSet<>();\n            JSONArray constraintRows = root.optJSONArray("modelConstraints");\n'''
              repl='''            int modelConstraintSchema = root.optInt("modelConstraintSchemaVersion", 1);\n            if (modelConstraintSchema < 1 || modelConstraintSchema > 2) {\n                throw new IllegalArgumentException("Unsupported model constraint schema: " + modelConstraintSchema);\n            }\n\n            ArrayList<SketchConstraint> constraints = new ArrayList<>();\n            LinkedHashSet<String> constraintIds = new LinkedHashSet<>();\n            JSONArray constraintRows = root.optJSONArray("modelConstraints");\n'''
              if anchor not in s: raise SystemExit('schema parse anchor missing')
              s=s.replace(anchor,repl,1)
          if 'modelConstraintSchema == 1 && kind == SketchConstraint.Kind.COINCIDENT' not in s:
              anchor='''                    boolean driving = row.optBoolean("driving", true);\n                    constraints.add(new SketchConstraint(id, kind, primary, primaryPoint,\n                            secondary, secondaryPoint, value, driving));\n'''
              repl='''                    boolean driving = row.optBoolean("driving", true);\n                    if (modelConstraintSchema == 1 && kind == SketchConstraint.Kind.COINCIDENT) {\n                        String oldPrimary = primary;\n                        int oldPrimaryPoint = primaryPoint;\n                        primary = secondary;\n                        primaryPoint = secondaryPoint;\n                        secondary = oldPrimary;\n                        secondaryPoint = oldPrimaryPoint;\n                    }\n                    constraints.add(new SketchConstraint(id, kind, primary, primaryPoint,\n                            secondary, secondaryPoint, value, driving));\n'''
              if anchor not in s: raise SystemExit('v1 coincident migration anchor missing')
              s=s.replace(anchor,repl,1)
          bridge.write_text(s)

          test=Path('app/src/test/java/ir/chobyar/sketch/core/K36dConstraintSchemaMigrationTest.java')
          if not test.exists():
              test.write_text(r'''package ir.chobyar.sketch.core;

import org.junit.Test;
import static org.junit.Assert.assertEquals;

public class K36dConstraintSchemaMigrationTest {
    @Test public void v1CoincidentOrderingMigratesToDirectedV2Contract() {
        String raw="{"+
                "\"schemaVersion\":2,"+
                "\"modelConstraintSchemaVersion\":1,"+
                "\"entities\":["+
                "{\"id\":\"target\",\"type\":\"LINE\",\"x1\":0,\"y1\":0,\"x2\":10,\"y2\":0},"+
                "{\"id\":\"driven\",\"type\":\"LINE\",\"x1\":20,\"y1\":0,\"x2\":30,\"y2\":0}],"+
                "\"modelConstraints\":[{"+
                "\"id\":\"c1\",\"kind\":\"COINCIDENT\","+
                "\"primaryEntityId\":\"target\",\"primaryPointIndex\":1,"+
                "\"secondaryEntityId\":\"driven\",\"secondaryPointIndex\":0,"+
                "\"driving\":true}]}";
        LegacySketchStateBridge.Result parsed=LegacySketchStateBridge.parse(raw);
        SketchConstraint c=parsed.constraints.get(0);
        assertEquals("driven",c.primaryEntityId);
        assertEquals(0,c.primaryPointIndex);
        assertEquals("target",c.secondaryEntityId);
        assertEquals(1,c.secondaryPointIndex);
    }

    @Test(expected=IllegalArgumentException.class)
    public void futureConstraintSchemaFailsClosed() {
        LegacySketchStateBridge.parse("{\"schemaVersion\":2,\"modelConstraintSchemaVersion\":99,\"entities\":[]}");
    }
}
''')
          PY
      - name: Verify schema migration and complete JVM regression
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Commit verified schema repair
        shell: bash
        run: |
          git config user.name chobyar-supervisor
          git config user.email actions@users.noreply.github.com
          git rm -f .github/workflows/k36d-schema-pr-fix.yml .github/workflows/k36d-schema-migration-fix.yml
          git add app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java app/src/main/java/ir/chobyar/sketch/core/LegacySketchStateBridge.java app/src/test/java/ir/chobyar/sketch/core/K36dConstraintSchemaMigrationTest.java
          git commit -m 'K3.6d: version directed endpoint constraint persistence'
          git pull --rebase origin k3-6d-coincident-point-authority
          git push origin HEAD:k3-6d-coincident-point-authority
