name: K3.22 Branch Patch

on:
  push:
    branches:
      - k3-22-offset-authority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact staging revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply fail-closed K3.22 Offset selection patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java')
          text = path.read_text()
          old = '    if (!prepareTransactionalSelection("offset-prepare")) {\n        return lastMirrorError == null || lastMirrorError.isEmpty()\n                ? "Select geometry first"\n                : "Offset unavailable: " + lastMirrorError;\n    }\n\n    ArrayList<SketchEntity> copies = new ArrayList<>();'
          new = '    if (!prepareTransactionalSelection("offset-prepare")) {\n        return lastMirrorError == null || lastMirrorError.isEmpty()\n                ? "Select geometry first"\n                : "Offset unavailable: " + lastMirrorError;\n    }\n    if (sketchDocument.selectionIds().size() <= 1) {\n        if (selected == null) return "Select geometry first";\n        String selectedId = selected.stableId();\n        if (selectedId == null || selectedId.trim().isEmpty()) {\n            return "Offset unavailable: selected geometry has no stable ID";\n        }\n        sketchDocument.selectOnly(selectedId);\n    }\n\n    ArrayList<SketchEntity> copies = new ArrayList<>();'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'FAIL-CLOSED: expected one Offset selection seam, found {count}')
          path.write_text(text.replace(old, new, 1))
          workflow = Path('.github/workflows/k322-branch-patch2.yml')
          if not workflow.exists():
              raise SystemExit('FAIL-CLOSED: staging workflow missing')
          workflow.unlink()
          PY
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/k322-branch-patch2.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java'
          git diff --check

      - name: Commit branch-only patch if head is still exact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin k3-22-offset-authority --depth=1
          test "$(git rev-parse origin/k3-22-offset-authority)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ir/chobyar/sketch/K33MirroredCadCanvasView.java .github/workflows/k322-branch-patch2.yml
          git commit -m 'K3.22: canonicalize single-selection Offset authority'
          git push origin HEAD:k3-22-offset-authority
