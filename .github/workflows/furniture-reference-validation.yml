name: Furniture Reference Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/androidTest/java/ir/chobyar/sketch/FurnitureReferenceInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/FurnitureSavedProjectsInstrumentationTest.java'
      - 'app/src/androidTest/java/ir/chobyar/sketch/ProductionHardeningInstrumentationTest.java'
      - 'app/src/main/java/ir/chobyar/sketch/FurnitureSampleProjectFactory.java'
      - 'app/src/main/java/ir/chobyar/sketch/InternalProjectRepository.java'
      - 'app/src/main/java/ir/chobyar/sketch/WorkspaceRecoveryStore.java'
      - 'app/src/main/java/ir/chobyar/sketch/CadProjectPersistenceController.java'
      - 'app/src/main/java/ir/chobyar/sketch/ChobYarActivity.java'
      - 'app/src/main/java/ir/chobyar/sketch/OcctStableCadCanvasView.java'
      - '.github/workflows/furniture-reference-validation.yml'

permissions:
  contents: read

concurrency:
  group: furniture-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-reference-furniture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHOBYAR_VERSION_CODE: 41${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.furniture-reference.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks
      - name: Build production and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render model and validate project safety on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p test-artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ir.chobyar.sketch.FurnitureReferenceInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/furniture-reference.txt
            grep -q 'OK (1 test)' test-artifacts/furniture-reference.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.FurnitureSavedProjectsInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/furniture-saved-projects.txt
            grep -q 'OK (1 test)' test-artifacts/furniture-saved-projects.txt
            adb shell am instrument -w -e class ir.chobyar.sketch.ProductionHardeningInstrumentationTest ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee test-artifacts/production-hardening.txt
            grep -q 'OK (3 tests)' test-artifacts/production-hardening.txt
            adb pull /sdcard/Android/data/ir.chobyar.sketch/files/furniture-validation test-artifacts/
            adb pull /sdcard/Android/data/ir.chobyar.sketch/files/saved-furniture-validation test-artifacts/
            test -s test-artifacts/furniture-validation/01-nightstand-front-closed.png
            test -s test-artifacts/furniture-validation/02-nightstand-iso-closed.png
            test -s test-artifacts/furniture-validation/03-nightstand-iso-open.png
            test -s test-artifacts/furniture-validation/04-nightstand-dimensioned-plan.png
            test -s test-artifacts/saved-furniture-validation/01-boulder-table-iso.png
            test -s test-artifacts/saved-furniture-validation/02-hourglass-table-iso.png
            test -s test-artifacts/saved-furniture-validation/03-boulder-table-front.png
            test -s test-artifacts/saved-furniture-validation/04-hourglass-table-front.png
      - name: Upload editable furniture APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar3D-editable-furniture-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-nightstand-reference-model
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 14
