name: Manual 26.100 Consolidated Regression

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/sketch-core-type-safe-20260820
    paths:
      - .github/workflows/manual26100-consolidated-regression.yml

permissions:
  contents: read

concurrency:
  group: manual26100-consolidated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHOBYAR_VERSION_CODE: 490${{ github.run_number }}
      CHOBYAR_VERSION_NAME: 0.3.manual26100.consolidated.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sketch-core-type-safe-20260820
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android 35 build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Restore development signing key
        run: base64 -d .github/chobyar-dev.keystore.b64 > chobyar-dev.jks

      - name: Build production and all instrumentation APKs
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee test-artifacts/consolidated-build.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run 42 core Sketch + 3D + Project contracts on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            mkdir -p test-artifacts
            : > test-artifacts/consolidated-summary.txt
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            run_contract() {
              class="$1"
              slug="$2"
              expected="$3"
              adb logcat -c
              adb shell am instrument -w -e class "ir.chobyar.sketch.${class}" ir.chobyar.sketch.test/androidx.test.runner.AndroidJUnitRunner | tee "test-artifacts/${slug}.txt"
              grep -Fq "$expected" "test-artifacts/${slug}.txt"
              adb logcat -d -v brief > "test-artifacts/${slug}-logcat.txt"
              printf '%s | %s\n' "$class" "$expected" | tee -a test-artifacts/consolidated-summary.txt
            }

            # Sketch interaction, primitives, selection, dimensions and constraints: 16 tests
            run_contract TouchInputContractInstrumentationTest touch 'OK (3 tests)'
            run_contract PinchZoomInstrumentationTest pinch 'OK (1 test)'
            run_contract SketchUndoRedoInstrumentationTest sketch-undo-redo 'OK (1 test)'
            run_contract SketchPrimitivesSnapInstrumentationTest sketch-primitives 'OK (5 tests)'
            run_contract SketchConstraintSolverInstrumentationTest sketch-constraints 'OK (5 tests)'
            run_contract SmartCommandSelectionInstrumentationTest command-selection 'OK (1 test)'

            # Solid / History / Boolean / Direct modeling: 16 tests
            run_contract SolidCommandInstrumentationTest solid 'OK (2 tests)'
            run_contract BooleanCommandInstrumentationTest boolean 'OK (3 tests)'
            run_contract BooleanKeepOriginalsInstrumentationTest boolean-keep 'OK (3 tests)'
            run_contract DirectFinishInstrumentationTest direct-finish 'OK (2 tests)'
            run_contract ShellPushPullInstrumentationTest shell-pushpull 'OK (2 tests)'
            run_contract SweepCommandInstrumentationTest sweep 'OK (1 test)'
            run_contract LoftCommandInstrumentationTest loft 'OK (1 test)'

            # Construction / exact Project / selected Body / associative reference: 10 tests
            run_contract ConstructionProjectInstrumentationTest construction-project 'OK (2 tests)'
            run_contract Project3DExactInstrumentationTest project-exact 'OK (3 tests)'
            run_contract Project3DSelectedBodyInstrumentationTest project-selected 'OK (3 tests)'
            run_contract AssociativeProjectProvenanceInstrumentationTest project-associative 'OK (4 tests)'

            test "$(wc -l < test-artifacts/consolidated-summary.txt)" -eq 17
            echo 'CONSOLIDATED_RESULT classes=17 tests=42 status=PASS' | tee -a test-artifacts/consolidated-summary.txt

      - name: Upload consolidated regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChobYar-manual26100-consolidated-regression
          path: test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
